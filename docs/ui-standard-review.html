document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"18a8f446-03fd-4690-80af-6e62a8875ec9\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet data-dc-atomics=\"\"><style>\nbody{margin:0;background:linear-gradient(180deg,#EFF5FA 0%,#E2EDF7 52%,#D3E2F0 100%);background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased}\na{color:#1F6BD4;text-decoration:none;border-bottom:.5px solid rgba(31,107,212,.35)}\na:hover{color:#0B8F84;border-bottom-color:rgba(11,143,132,.45)}\ncode{font:400 .92em ui-monospace,'SF Mono',Menlo,monospace;background:rgba(0,0,0,.05);border-radius:4px;padding:1px 4px}\n<\u002Fstyle>\n\n<\u002Fhelmet>\n<div style=\"max-width:1120px;margin:0 auto;padding:44px 28px 120px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',system-ui,sans-serif;color:#0B1826;text-wrap:pretty\">\n\n  <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:20px\">\n    <div style=\"width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#11B3A4,#0B8F84 52%,#066A62);box-shadow:0 4px 14px rgba(11,143,132,.32);display:flex;align-items:center;justify-content:center;flex:none\">\n      <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"#fff\" aria-hidden=\"true\"><path d=\"M3 12c3-4.2 7-6.2 11-6.2 2.1 0 3.9.6 5.3 1.7l1.2-1.4c.3-.3.8-.1.8.3v11.2c0 .4-.5.6-.8.3l-1.2-1.4A8.7 8.7 0 0 1 14 18.2C10 18.2 6 16.2 3 12Zm12.6-2.2a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6Z\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.14em;color:rgba(0,0,0,.42);text-transform:uppercase\">UI Standard · v2 提案<\u002Fdiv>\n  <\u002Fdiv>\n\n  <h1 style=\"font:700 36px/1.2 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;margin:0 0 12px;letter-spacing:-.01em\">MacPleco 界面标准<\u002Fh1>\n  <p style=\"font:400 16px/1.65 inherit;color:rgba(0,0,0,.62);margin:0 0 8px;max-width:60ch\">全产品一致的 UI 对象、尺寸档位、语义色与页面骨架。取代 <a href=\"https://github.com/decli/MacPleco/blob/claude/mole-friendly-ui-design-hpq8dz/docs/ui-standard.md\">docs/ui-standard.md v1.0<\u002Fa>。<\u002Fp>\n  <p style=\"font:400 12px/1.7 inherit;color:rgba(0,0,0,.42);margin:0 0 40px;max-width:70ch\">依据 <code>Design/Theme.swift<\u002Fcode>（Palette / Radius / Space / Typo）、<code>Design/Components.swift<\u002Fcode>（15 个组件）、<code>Design/Glass.swift<\u002Fcode>、README 的产品原则，以及你提供的 5 张截图。v1.0 的实测数据被引用为现状证据。<\u002Fp>\n\n  <div style=\"background:rgba(11,143,132,.10);border:.5px solid rgba(11,143,132,.28);border-radius:22px;padding:26px 28px;margin-bottom:16px\">\n    <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.12em;color:#066A62;text-transform:uppercase;margin-bottom:12px\">审阅结论<\u002Fdiv>\n    <p style=\"font:400 17px/1.7 inherit;margin:0 0 14px;max-width:62ch\">v1.0 是一份<strong style=\"font-weight:600\">扎实的文档<\u002Fstrong>——真实测量、问题清单准确、还给了 CI 拦截。它的骨架我保留。<\u002Fp>\n    <p style=\"font:400 15px/1.7 inherit;margin:0;max-width:62ch;color:rgba(0,0,0,.72)\">但它有 <strong style=\"font-weight:600\">3 处方向性判断我不同意<\u002Fstrong>，以及 <strong style=\"font-weight:600\">4 块它完全没覆盖的空白<\u002Fstrong>。最关键的一条：v1.0 把你反馈的三个问题都当成<em>尺寸不一致<\u002Fem>来治，而第三个问题的病根是<em>视觉语义<\u002Fem>——那颗粉红实心的「卸载所选」违反了 MacPleco 写在 README 第一段的产品原则。<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));gap:14px;margin-bottom:52px\">\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:16px;padding:18px 20px\">\n      <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:12px\">\n        <div style=\"width:17px;height:17px;border-radius:999px;background:rgba(28,138,78,.16);display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\" stroke=\"#1C8A4E\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 6.4 4.6 9 10 3.2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"font:600 13px/1 inherit\">保留 v1.0 的<\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"margin:0;padding-left:15px;font:400 12.5px/1.8 inherit;color:rgba(0,0,0,.68)\">\n        <li>「一行一档」原则<\u002Fli>\n        <li>报头行作为侧栏与内容列的共享带<\u002Fli>\n        <li>Badge 收成一个组件、吞掉九种写法<\u002Fli>\n        <li>动效时长收成五档<\u002Fli>\n        <li>行高与圆角的具体数值（56 / 40 / 48 / 16 / 12）<\u002Fli>\n        <li>CI grep 拦截 + 验收数字表<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:16px;padding:18px 20px\">\n      <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:12px\">\n        <div style=\"width:17px;height:17px;border-radius:999px;background:rgba(176,112,10,.16);display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\" stroke=\"#B0700A\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M2 6h8M7 3l3 3-3 3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"font:600 13px/1 inherit\">修正 3 处<\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"margin:0;padding-left:15px;font:400 12.5px/1.8 inherit;color:rgba(0,0,0,.68)\">\n        <li><strong style=\"font-weight:600\">对齐基准<\u002Fstrong>：框居中 → 基线对齐，且品牌字标降级<\u002Fli>\n        <li><strong style=\"font-weight:600\">默认控件高度<\u002Fstrong>：24 → 28（中文字身塞不进 24）<\u002Fli>\n        <li><strong style=\"font-weight:600\">破坏性动作<\u002Fstrong>：允许实心 danger → 禁止实心<\u002Fli>\n      <\u002Ful>\n      <div style=\"height:.5px;background:rgba(0,0,0,.1);margin:12px 0\"><\u002Fdiv>\n      <div style=\"font:400 11.5px/1.7 inherit;color:rgba(0,0,0,.5)\">附带：「只有 24/32/44 三种高度」——44 是 iOS 触控尺寸，不是 macOS 控件档；三档里没有 28，等于没有默认档。<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:16px;padding:18px 20px\">\n      <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:12px\">\n        <div style=\"width:17px;height:17px;border-radius:999px;background:rgba(31,107,212,.16);display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\" stroke=\"#1F6BD4\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M6 2v8M2 6h8\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"font:600 13px/1 inherit\">补充 4 块<\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"margin:0;padding-left:15px;font:400 12.5px/1.8 inherit;color:rgba(0,0,0,.68)\">\n        <li><strong style=\"font-weight:600\">数字排版规范<\u002Fstrong>——这是一个量东西的 App，数字就是内容<\u002Fli>\n        <li><strong style=\"font-weight:600\">玻璃控件最小可辨度<\u002Fstrong>——浅色地上「玻璃」等于没有边界<\u002Fli>\n        <li><strong style=\"font-weight:600\">可逆性的视觉语法<\u002Fstrong>——把 README 第一原则变成可执行规则<\u002Fli>\n        <li><strong style=\"font-weight:600\">中英混排规则<\u002Fstrong>——中文字身满格，留白不能照抄拉丁<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.12em;color:rgba(0,0,0,.42);text-transform:uppercase;margin-bottom:8px\">第一部分<\u002Fdiv>\n  <h2 style=\"font:600 24px/1.3 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;margin:0 0 8px\">你反馈的三个问题 · 根因诊断<\u002Fh2>\n  <p style=\"font:400 13.5px/1.7 inherit;color:rgba(0,0,0,.55);margin:0 0 20px;max-width:64ch\">每一条都分四层：症状（你看到的）、真因（代码里的）、v1.0 的处方、我的处方。<\u002Fp>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px;margin-bottom:52px\">\n\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:24px 26px\">\n      <div style=\"display:flex;align-items:baseline;gap:11px;margin-bottom:16px\">\n        <div style=\"font:700 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:#fff;background:#0B1826;border-radius:5px;padding:4px 7px;flex:none\">01<\u002Fdiv>\n        <div style=\"font:600 18px/1.3 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif\">品牌字标与页面标题不在一条线上<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showEvidence }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background:rgba(0,0,0,.045);border-radius:12px;padding:10px;margin-bottom:16px;overflow:hidden\">\n          <img src=\"1080d500-e3fa-43dc-ade2-d0175bade875\" alt=\"侧栏 MacPleco 字标与页面标题「概览」的高度不一致\" style=\"display:block;max-width:100%;height:auto;border-radius:6px\">\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:20px\">\n        <div>\n          <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.1em;color:rgba(0,0,0,.42);text-transform:uppercase;margin-bottom:8px\">真正的原因<\u002Fdiv>\n          <p style=\"font:400 13px/1.75 inherit;color:rgba(0,0,0,.68);margin:0\">不只是「两列各设上边距」（12 vs 24，文字中心差 9pt）。更根本的是：<strong style=\"font-weight:600\">两处文字字号不同（17 vs 20），却被要求看起来等价<\u002Fstrong>。把两个不同字号的文字框垂直居中到同一条带子里，框齐了、字仍然不齐——中文字身满格、拉丁字母有升降部，两者的光学重心本来就不在框中心。<\u002Fp>\n        <\u002Fdiv>\n        <sc-if value=\"{{ compareV1 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.1em;color:rgba(0,0,0,.42);text-transform:uppercase;margin-bottom:8px\">v1.0 的处方<\u002Fdiv>\n            <p style=\"font:400 13px/1.75 inherit;color:rgba(0,0,0,.5);margin:0\">建一条 32 高的报头带，两列内容都在带子里垂直居中，验收目标是「文字中心 y 相等」。方向对，基准错。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div>\n          <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.1em;color:#066A62;text-transform:uppercase;margin-bottom:8px\">我的处方<\u002Fdiv>\n          <p style=\"font:400 13px/1.75 inherit;color:rgba(0,0,0,.68);margin:0\">报头带保留，但对齐基准换成 <strong style=\"font-weight:600\">基线<\u002Fstrong>；并且——品牌字标不该和页面标题同一个响度。侧栏已经在回答「这是哪个 App」，所以字标降到 15 semibold / <code>inkSecondary<\u002Fcode>，页面标题独占 20 bold。<strong style=\"font-weight:600\">层级一分开，对不齐就不再是问题<\u002Fstrong>，因为眼睛不再拿它们互相比。<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:24px 26px\">\n      <div style=\"display:flex;align-items:baseline;gap:11px;margin-bottom:16px\">\n        <div style=\"font:700 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:#fff;background:#0B1826;border-radius:5px;padding:4px 7px;flex:none\">02<\u002Fdiv>\n        <div style=\"font:600 18px/1.3 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif\">筛选行：三个控件，三种高度，三种字号<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showEvidence }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background:rgba(0,0,0,.045);border-radius:12px;padding:10px;margin-bottom:14px;overflow:hidden\">\n          <img src=\"cb67e46e-14c0-4136-a4fc-5ee263f007b2\" alt=\"搜索应用、最久未用、含系统自带三个控件的高度与字号都不一致\" style=\"display:block;max-width:100%;height:auto;border-radius:6px\">\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px\">\n        <div style=\"font:400 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.62);background:rgba(0,0,0,.05);border-radius:6px;padding:6px 9px\">搜索 31 高 · 12pt<\u002Fdiv>\n        <div style=\"font:400 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.62);background:rgba(0,0,0,.05);border-radius:6px;padding:6px 9px\">下拉 24 高 · 13pt<\u002Fdiv>\n        <div style=\"font:400 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.62);background:rgba(0,0,0,.05);border-radius:6px;padding:6px 9px\">开关 24 高（本体 15）· 11pt<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:20px\">\n        <div>\n          <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.1em;color:rgba(0,0,0,.42);text-transform:uppercase;margin-bottom:8px\">真正的原因<\u002Fdiv>\n          <p style=\"font:400 13px/1.75 inherit;color:rgba(0,0,0,.68);margin:0\">这一行不存在「行」这个对象。三个控件由三处代码各自加内边距、各自挑字号。<strong style=\"font-weight:600\">令牌阻止不了这件事<\u002Fstrong>——<code>SearchField<\u002Fcode> 已经是全 App 唯一实现了，它照样比邻居高 7pt，因为没有任何东西规定它要和谁并排。<\u002Fp>\n        <\u002Fdiv>\n        <sc-if value=\"{{ compareV1 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.1em;color:rgba(0,0,0,.42);text-transform:uppercase;margin-bottom:8px\">v1.0 的处方<\u002Fdiv>\n            <p style=\"font:400 13px/1.75 inherit;color:rgba(0,0,0,.5);margin:0\">全部压到 24 高、文字统一 13pt，新增 <code>FilterRow<\u002Fcode> 组件。统一是对的，<strong style=\"font-weight:600\">但 24 太矮<\u002Fstrong>。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div>\n          <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.1em;color:#066A62;text-transform:uppercase;margin-bottom:8px\">我的处方<\u002Fdiv>\n          <p style=\"font:400 13px/1.75 inherit;color:rgba(0,0,0,.68);margin:0\">目标值定 <strong style=\"font-weight:600\">28<\u002Fstrong>：24 高胶囊里放 13pt 中文，上下只剩 5.5pt，中文字身满格会顶到边；28 正好等于 macOS 26 <code>.controlSize(.large)<\u002Fcode>，系统控件能直接对上。再加一条 v1.0 没写的：<strong style=\"font-weight:600\">同一行所有标签同一字号<\u002Fstrong>，开关标签也是 13——你说的「字体大小也不一」正是这个。高度由 <code>FilterRow<\u002Fcode> 容器<em>施加<\u002Fem>给子项，页面无法再传尺寸。<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:rgba(206,59,54,.07);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(206,59,54,.24);border-radius:22px;padding:24px 26px\">\n      <div style=\"display:flex;align-items:baseline;gap:11px;margin-bottom:6px\">\n        <div style=\"font:700 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:#fff;background:#CE3B36;border-radius:5px;padding:4px 7px;flex:none\">03<\u002Fdiv>\n        <div style=\"font:600 18px/1.3 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif\">「卸载所选」比同类按钮大很多<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font:400 12px/1.6 inherit;color:#CE3B36;margin:0 0 18px\">这条我和 v1.0 分歧最大。<\u002Fp>\n      <sc-if value=\"{{ showEvidence }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px\">\n          <div style=\"background:rgba(0,0,0,.045);border-radius:12px;padding:10px;overflow:hidden\">\n            <img src=\"af7cdb92-538b-4d05-a7d5-1f2ad9f660e6\" alt=\"粉红实心的卸载所选按钮\" style=\"display:block;max-width:100%;height:auto;border-radius:6px\">\n          <\u002Fdiv>\n          <div style=\"background:rgba(0,0,0,.045);border-radius:12px;padding:10px;overflow:hidden\">\n            <img src=\"f3233e70-c287-475d-8a17-85e65e4ca41d\" alt=\"概览页的开始清理与看看有哪些两个按钮\" style=\"display:block;max-width:100%;height:auto;border-radius:6px\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:20px\">\n        <div>\n          <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.1em;color:rgba(0,0,0,.42);text-transform:uppercase;margin-bottom:8px\">真正的原因<\u002Fdiv>\n          <p style=\"font:400 13px/1.75 inherit;color:rgba(0,0,0,.68);margin:0 0 10px\">尺寸上，它和「开始清理」<strong style=\"font-weight:600\">其实一样大<\u002Fstrong>（都是 133×44）。你觉得它更大，是因为它周围的东西只有 11–13pt——这是<em>尺寸问题<\u002Fem>，v1.0 治对了。<\u002Fp>\n          <p style=\"font:400 13px/1.75 inherit;color:rgba(0,0,0,.68);margin:0\">但真问题在语义：它是<strong style=\"font-weight:600\">全页最响的实心色块，而它是不可逆操作<\u002Fstrong>。README 第一段写着「别的清理软件把破坏性按钮做成最显眼的那个，MacPleco 反其道而行」。<strong style=\"font-weight:600\">这颗按钮违反了产品自己的第一原则。<\u002Fstrong>还有个硬伤：浅色下白字压在 <code>danger<\u002Fcode> 实心上约 2.6:1，不到 4.5:1。<\u002Fp>\n        <\u002Fdiv>\n        <sc-if value=\"{{ compareV1 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.1em;color:rgba(0,0,0,.42);text-transform:uppercase;margin-bottom:8px\">v1.0 的处方<\u002Fdiv>\n            <p style=\"font:400 13px/1.75 inherit;color:rgba(0,0,0,.5);margin:0\">降到 M 档 32，选择条从 64 收到 48。<strong style=\"font-weight:600\">但它明确允许 Primary 用 <code>danger<\u002Fcode> 做实心填充<\u002Fstrong>——尺寸治好了，语义原样保留。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div>\n          <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.1em;color:#066A62;text-transform:uppercase;margin-bottom:8px\">我的处方<\u002Fdiv>\n          <p style=\"font:400 13px/1.75 inherit;color:rgba(0,0,0,.68);margin:0\">降档到 28（默认档），同时<strong style=\"font-weight:600\">禁止破坏性动作使用实心填充<\u002Fstrong>。破坏性只有两种形态：列表里的 <em>danger 描边 + danger 文字<\u002Fem>，和确认 Sheet 里的 <em>实心<\u002Fem>（此时用户已明确表达意图，且 Sheet 内没有别的实心块与它竞争）。附带一条：<strong style=\"font-weight:600\">「移到废纸篓」是可逆的，不该用 danger<\u002Fstrong>——只有「永久删除」和「卸载」才是。详见 <a href=\"#destructive\">第五部分<\u002Fa>。<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n\n  <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.12em;color:rgba(0,0,0,.42);text-transform:uppercase;margin:0 0 8px\">第二部分<\u002Fdiv>\n  <h2 style=\"font:600 24px/1.3 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;margin:0 0 8px\">Before → After · 应用 · 已安装<\u002Fh2>\n  <p style=\"font:400 12px/1.6 inherit;color:rgba(0,0,0,.42);margin:0 0 14px\">两张窗口都按 1200 pt 的真实密度绘制——标注只在这个密度下成立，所以它们横向滚动而不重排。<\u002Fp>\n  <p style=\"font:400 13.5px/1.7 inherit;color:rgba(0,0,0,.55);margin:0 0 22px;max-width:66ch\">选这一页做样张，因为三个问题在它身上同时出现：报头行、筛选行、卸载按钮，再加一个你没提但同样有问题的对象——页签。窗口按 1200×800 的比例绘制，标注即验收数字。<\u002Fp>\n\n  <sc-if value=\"{{ showBefore }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"margin-bottom:26px\">\n    <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:11px\">\n      <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.1em;color:#fff;background:rgba(206,59,54,.9);border-radius:5px;padding:5px 8px\">BEFORE<\u002Fdiv>\n      <div style=\"font:400 12px/1.5 inherit;color:rgba(0,0,0,.5)\">0.3.6 现状<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"overflow-x:auto;overflow-y:hidden;border-radius:14px\">\n    <div style=\"width:1200px;border-radius:14px;overflow:hidden;border:.5px solid rgba(0,0,0,.16);box-shadow:0 22px 54px rgba(11,24,38,.18);background:linear-gradient(180deg,#EFF5FA,#E2EDF7 52%,#D3E2F0)\">\n      <div style=\"height:52px;display:flex;align-items:center;gap:8px;padding:0 20px;border-bottom:.5px solid rgba(0,0,0,.06)\">\n        <div style=\"width:12px;height:12px;border-radius:999px;background:#F1655A\"><\u002Fdiv>\n        <div style=\"width:12px;height:12px;border-radius:999px;background:#F5BE4F\"><\u002Fdiv>\n        <div style=\"width:12px;height:12px;border-radius:999px;background:#61C554\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;min-height:400px\">\n\n        <div style=\"width:244px;flex:none;border-right:.5px solid rgba(0,0,0,.07);position:relative\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:12px 20px 8px\">\n            <div style=\"width:30px;height:30px;border-radius:8p e-linecap=\"round\"><rect x=\"2.6\" y=\"2.6\" width=\"4.8\" height=\"4.8\" rx=\"1.2\"><\u002Frect><rect x=\"8.6\" y=\"2.6\" width=\"4.8\" height=\"4.8\" rx=\"1.2\"><\u002Frect><rect x=\"2.6\" y=\"8.6\" width=\"4.8\" height=\"4.8\" rx=\"1.2\"><\u002Frect><rect x=\"8.6\" y=\"8.6\" width=\"4.8\" height=\"4.8\" rx=\"1.2\"><\u002Frect><\u002Fsvg>应用<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:7px;font:500 15px/1 inherit;color:rgba(0,0,0,.72)\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"rgba(0,0,0,.5)\" stroke-width=\"1.5\" stroke-linecap=\"round\"><rect x=\"2.6\" y=\"2.6\" width=\"10.8\" height=\"10.8\" rx=\"1.6\"><\u002Frect><path d=\"M2.6 6.6h10.8M6.6 6.6v6.8\"><\u002Fpath><\u002Fsvg>空间<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:7px;font:500 15px/1 inherit;color:rgba(0,0,0,.72)\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"rgba(0,0,0,.5)\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M8 2.4v2M8 11.6v2M2.4 8h2M11.6 8h2\"><\u002Fpath><circle cx=\"8\" cy=\"8\" r=\"2.6\"><\u002Fcircle><\u002Fsvg>优化<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:7px;font:500 15px/1 inherit;color:rgba(0,0,0,.72)\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"rgba(0,0,0,.5)\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M2.4 10.4 5.6 6l2.6 2.8L11 4.6l2.6 4.2\"><\u002Fpath><\u002Fsvg>监控<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:0;right:0;top:27px;border-top:1px dashed rgba(206,59,54,.75)\"><\u002Fdiv>\n          <div style=\"position:absolute;right:10px;top:2px;font:600 9px/1 ui-monospace,'SF Mono',Menlo,monospace;color:#CE3B36;white-space:nowrap\">字标中心 y=79<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1;min-width:0;padding:24px 32px 32px;position:relative\">\n          <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:8px\">\n            <div style=\"min-width:0\">\n              <div style=\"font:700 20px/1.2 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;color:#0B1826;margin-bottom:4px\">应用<\u002Fdiv>\n              <div style=\"font:400 13px/1.35 inherit;color:rgba(0,0,0,.62);white-space:nowrap\">看清每个 App 占了多少，卸载时连它留下的东西一起清掉<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <div style=\"display:flex;background:rgba(0,0,0,.08);border-radius:6px;padding:1.5px;flex:none\">\n              <div style=\"font:400 13px/1 -apple-system,'PingFang SC',system-ui,sans-serif;padding:5.5px 13px;border-radius:5px;background:#fff;box-shadow:0 .5px 2px rgba(0,0,0,.16);color:#0B1826\">已安装<\u002Fdiv>\n              <div style=\"font:400 13px/1 -apple-system,'PingFang SC',system-ui,sans-serif;padding:5.5px 13px;border-radius:5px;color:rgba(0,0,0,.66)\">开机启动<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:0;right:0;top:36px;border-top:1px dashed rgba(206,59,54,.75)\"><\u002Fdiv>\n          <div style=\"position:absolute;left:32px;top:11px;font:600 9px/1 ui-monospace,'SF Mono',Menlo,monospace;color:#CE3B36;white-space:nowrap\">标题中心 y=88 · 比字标低 9pt<\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;gap:12px;margin:22px 0 16px;position:relative;outline:1px dashed rgba(206,59,54,.55);outline-offset:3px\">\n            <div style=\"position:absolute;left:0;top:100%;margin-top:9px;font:600 9px/1 ui-monospace,'SF Mono',Menlo,monospace;color:#CE3B36;white-space:nowrap\">31 / 24 / 24 高 · 12 / 13 / 11 pt<\u002Fdiv>\n            <div style=\"width:260px;flex:none;height:31px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;gap:8px;padding:0 12px;border-radius:999px;backgroun
