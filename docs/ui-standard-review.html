inecap=\"round\"><path d=\"M2 6.2 4.5 8.8 10 3.2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <span style=\"font:500 12px/1 inherit;color:#1F6BD4\">取消全选<\u002Fspan>\n            <div style=\"display:flex;align-items:baseline;gap:4px\"><span style=\"font:400 11px/1 inherit;color:rgba(0,0,0,.42)\">已选<\u002Fspan><span style=\"font:600 13px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#0B1826\">3<\u002Fspan><span style=\"font:400 11px/1 inherit;color:rgba(0,0,0,.26)\">/ 142<\u002Fspan><span style=\"font:600 13px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:rgba(0,0,0,.62);margin-left:8px\">18.4<\u002Fspan><span style=\"font:400 11px/1 inherit;color:rgba(0,0,0,.42)\">GB<\u002Fspan><\u002Fdiv>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <div style=\"height:28px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;gap:7px;padding:0 14px;border-radius:999px;background:rgba(206,59,54,.06);border:1px solid rgba(206,59,54,.5);flex:none\">\n              <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#B8302B\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M3 5.5h10M4.5 5.5v7a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1v-7M6.4 5.5V4a1 1 0 0 1 1-1h1.2a1 1 0 0 1 1 1v1.5\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font:500 13px/1 inherit;color:#B8302B\">卸载所选<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"position:absolute;right:0;top:-17px;font:600 9px/1 ui-monospace,'SF Mono',Menlo,monospace;color:#066A62;white-space:nowrap\">选择条 48 · 按钮 28 · danger 描边 · 文字 5.1:1<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"display:flex;align-items:center;gap:12px;height:56px;box-sizing:border-box;padding:0 12px;border-radius:16px;background:rgba(11,143,132,.08);border:1.5px solid rgba(11,143,132,.5)\">\n              <div style=\"width:16px;height:16px;border-radius:4px;background:linear-gradient(135deg,#11B3A4,#066A62);display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.6\" stroke-linecap=\"round\"><path d=\"M2 6.2 4.5 8.8 10 3.2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <div style=\"width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#8E9BB0,#5C6B85);flex:none\"><\u002Fdiv>\n              <div style=\"min-width:0;flex:1\">\n                <div style=\"font:600 13px/1.35 inherit;color:#0B1826\">Final Cut Pro<\u002Fdiv>\n                <div style=\"font:400 11px/1.35 inherit;color:rgba(0,0,0,.42)\">1 年 2 个月未打开 · 5.2.1<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"width:80px;text-align:right;flex:none\"><span style=\"font:600 12px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#0B1826\">4.31<\u002Fspan> <span style=\"font:400 11px/1 inherit;color:rgba(0,0,0,.42)\">GB<\u002Fspan><\u002Fdiv>\n              <div style=\"width:96px;display:flex;justify-content:flex-end;gap:6px;flex:none\">\n                <div style=\"width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.05)\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#1F6BD4\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M2 4.6a1 1 0 0 1 1-1h3l1.4 1.6h5.6a1 1 0 0 1 1 1v6.2a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                <div style=\"height:24px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;padding:0 10px;border-radius:999px;border:1px solid rgba(206,59,54,.45);font:500 12px/1 inherit;color:#B8302B\">卸载<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px;height:56px;box-sizing:border-box;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.42);border:.5px solid rgba(0,0,0,.08)\">\n              <div style=\"width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.26);box-sizing:border-box;flex:none\"><\u002Fdiv>\n              <div style=\"width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#7FB2E8,#3B6FA8);flex:none\"><\u002Fdiv>\n              <div style=\"min-width:0;flex:1\">\n                <div style=\"font:600 13px/1.35 inherit;color:#0B1826\">Xcode<\u002Fdiv>\n                <div style=\"font:400 11px/1.35 inherit;color:rgba(0,0,0,.42)\">3 天前打开 · 26.0<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"width:80px;text-align:right;flex:none\"><span style=\"font:600 12px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#0B1826\">12.7<\u002Fspan> <span style=\"font:400 11px/1 inherit;color:rgba(0,0,0,.42)\">GB<\u002Fspan><\u002Fdiv>\n              <div style=\"width:96px;display:flex;justify-content:flex-end;gap:6px;flex:none\">\n                <div style=\"height:24px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;padding:0 10px;border-radius:999px;border:1px solid rgba(206,59,54,.45);font:500 12px/1 inherit;color:#B8302B\">卸载<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px\">\n      <div style=\"font:400 11px/1.5 inherit;color:#066A62;background:rgba(11,143,132,.1);border-radius:6px;padding:6px 10px\">字标 15 semibold / secondary，与 20 bold 标题共享基线<\u002Fdiv>\n      <div style=\"font:400 11px/1.5 inherit;color:#066A62;background:rgba(11,143,132,.1);border-radius:6px;padding:6px 10px\">筛选行 28 高 · 全行 13pt<\u002Fdiv>\n      <div style=\"font:400 11px/1.5 inherit;color:#066A62;background:rgba(11,143,132,.1);border-radius:6px;padding:6px 10px\">选择条 48 高 · 破坏性按钮改描边<\u002Fdiv>\n      <div style=\"font:400 11px/1.5 inherit;color:#066A62;background:rgba(11,143,132,.1);border-radius:6px;padding:6px 10px\">页签下沉到内容左边线，不再和标题抢位<\u002Fdiv>\n      <div style=\"font:400 11px/1.5 inherit;color:#066A62;background:rgba(11,143,132,.1);border-radius:6px;padding:6px 10px\">侧栏左边线统一 24 · 图标盒 28<\u002Fdiv>\n      <div style=\"font:400 11px/1.5 inherit;color:#066A62;background:rgba(11,143,132,.1);border-radius:6px;padding:6px 10px\">数值 / 单位分离 · 数值列 80 · 动作区 96<\u002Fdiv>\n      <div style=\"font:400 11px/1.5 inherit;color:#066A62;background:rgba(11,143,132,.1);border-radius:6px;padding:6px 10px\">复选框 16 · 选中态 aqua 8% + 1.5 描边<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:rgba(31,107,212,.07);border:.5px solid rgba(31,107,212,.22);border-radius:14px;padding:16px 18px;margin-top:14px\">\n      <div style=\"font:600 12px/1 inherit;color:#1F6BD4;margin-bottom:9px\">顺手修掉的第四个问题：页签<\u002Fdiv>\n      <p style=\"font:400 12.5px/1.75 inherit;color:rgba(0,0,0,.68);margin:0;max-width:72ch\">「已安装 / 开机启动」是<strong style=\"font-weight:600\">导航<\u002Fstrong>，不是页面级控件。v1.0 把它留在报头插槽，于是插槽要同时容纳 24 高的分段和 32 高的幽灵按钮，高度只能随内容变（它自己的 P10）。我的规则：<strong style=\"font-weight:600\">报头插槽只放一个控件，且永不放导航<\u002Fstrong>；页签下沉到内容列左边线——它切换的是下面那张列表，就该长在列表上面。插槽因此恒为 28 高，说明行也不再忽高忽低。<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.12em;color:rgba(0,0,0,.42);text-transform:uppercase;margin:0 0 8px\">第三部分<\u002Fdiv>\n  <h2 style=\"font:600 24px/1.3 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;margin:0 0 8px\">六条原则<\u002Fh2>\n  <p style=\"font:400 13.5px/1.7 inherit;color:rgba(0,0,0,.55);margin:0 0 20px;max-width:66ch\">每条都能落成一个检查项。前两条是 v1.0 的，第三到第五条是新的，第六条照抄。<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(316px,1fr));gap:12px;margin-bottom:52px\">\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:16px;padding:18px 20px\">\n      <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:8px\"><span style=\"font:700 20px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;color:#0B8F84\">1<\u002Fspan><span style=\"font:600 14px/1.3 inherit\">容器定尺寸，页面不定<\u002Fspan><\u002Fdiv>\n      <p style=\"font:400 12.5px/1.75 inherit;color:rgba(0,0,0,.68);margin:0\">一致性不来自令牌，来自容器。<code>SearchField<\u002Fcode> 已经是唯一实现，它照样比邻居高 7pt——因为没有东西规定它跟谁并排。筛选行、选择条、行卡、报头都是容器，高度与字号由容器<em>施加<\u002Fem>给子项；子项不接受尺寸参数。<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:16px;padding:18px 20px\">\n      <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:8px\"><span style=\"font:700 20px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;color:#0B8F84\">2<\u002Fspan><span style=\"font:600 14px/1.3 inherit\">一行一档，一行一字号<\u002Fspan><\u002Fdiv>\n      <p style=\"font:400 12.5px/1.75 inherit;color:rgba(0,0,0,.68);margin:0\">同一条水平线上的控件必须同高、同字号。v1.0 只写了同高——你反馈的第二个问题里，「字体大小也不一」和高度不一各占一半。<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:16px;padding:18px 20px\">\n      <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:8px\"><span style=\"font:700 20px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;color:#0B8F84\">3<\u002Fspan><span style=\"font:600 14px/1.3 inherit\">基线优先于框<\u002Fspan><\u002Fdiv>\n      <p style=\"font:400 12.5px/1.75 inherit;color:rgba(0,0,0,.68);margin:0\">两段不同字号的文字要看起来在一条线上，对齐的是<strong style=\"font-weight:600\">基线<\u002Fstrong>，不是文字框的中心。中文字身满格、拉丁有升降部，框居中必然差几个点。中英混排的 App 不能用框居中当验收标准。<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:16px;padding:18px 20px\">\n      <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:8px\"><span style=\"font:700 20px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;color:#CE3B36\">4<\u002Fspan><span style=\"font:600 14px/1.3 inherit\">响度对应后果<\u002Fspan><\u002Fdiv>\n      <p style=\"font:400 12.5px/1.75 inherit;color:rgba(0,0,0,.68);margin:0\"><strong style=\"font-weight:600\">越不可逆的动作，视觉越安静。<\u002Fstrong>最响的实心色块留给「让用户变好的那件事」（开始清理），不给「拿走东西的那件事」（卸载、永久删除）。这是 README 第一原则的可执行版本。<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:16px;padding:18px 20px\">\n      <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:8px\"><span style=\"font:700 20px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;color:#1F6BD4\">5<\u002Fspan><span style=\"font:600 14px/1.3 inherit\">数字是内容<\u002Fspan><\u002Fdiv>\n      <p style=\"font:400 12.5px/1.75 inherit;color:rgba(0,0,0,.68);margin:0\">这是一个量东西的 App。数字排版是正文排版：等宽数位、数值与单位分离、列右对齐、精度分档。v1.0 补了 <code>*Numeric<\u002Fcode> 角色，但没定这些规则。<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:16px;padding:18px 20px\">\n      <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:8px\"><span style=\"font:700 20px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;color:rgba(0,0,0,.42)\">6<\u002Fspan><span style=\"font:600 14px/1.3 inherit\">可以量<\u002Fspan><\u002Fdiv>\n      <p style=\"font:400 12.5px/1.75 inherit;color:rgba(0,0,0,.68);margin:0\">每条规则都有数字，改完用探针量，量不到就不算改完。v1.0 的做法，照抄。<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.12em;color:rgba(0,0,0,.42);text-transform:uppercase;margin:0 0 8px\">第四部分<\u002Fdiv>\n  <h2 style=\"font:600 24px/1.3 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;margin:0 0 8px\">令牌<\u002Fh2>\n  <p style=\"font:400 13.5px/1.7 inherit;color:rgba(0,0,0,.55);margin:0 0 22px;max-width:66ch\">页面文件里不出现数字。所有尺寸、颜色、字体都从这里取。<code>Space<\u002Fcode> 与 <code>Radius<\u002Fcode> 沿用现有定义，新增 <code>Control<\u002Fcode> 与 <code>Glyph<\u002Fcode>。<\u002Fp>\n\n  <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:24px 26px;margin-bottom:14px\">\n    <div style=\"font:600 16px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:4px\">控件档位 <code style=\"font-weight:400\">Control<\u002Fcode><\u002Fdiv>\n    <p style=\"font:400 12.5px/1.7 inherit;color:rgba(0,0,0,.55);margin:0 0 20px;max-width:70ch\">四档，一个主力。<strong style=\"font-weight:600;color:#0B1826\">28 是默认档<\u002Fstrong>——13pt 中文需要上下各 7pt 余量，24 给不了；28 正好等于 macOS 26 的 <code>.controlSize(.large)<\u002Fcode>，系统分段、下拉、开关能直接对上。v1.0 的 24/32/44 三档里没有默认档，于是「筛选行」和「Sheet 页脚」为了没有语义的理由分成两个高度。<\u002Fp>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n        <div style=\"width:104px;flex:none\"><div style=\"font:600 12.5px/1.4 inherit\">紧凑 24<\u002Fdiv><div style=\"font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">Control.compact<\u002Fdiv><\u002Fdiv>\n        <div style=\"height:24px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.62);border:.5px solid rgba(0,0,0,.15);font:500 12px/1 inherit;color:#0B1826;flex:none\">卸载<\u002Fdiv>\n        <div style=\"width:24px;height:24px;border-radius:6px;background:rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#1F6BD4\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M2 4.6a1 1 0 0 1 1-1h3l1.4 1.6h5.6a1 1 0 0 1 1 1v6.2a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"font:400 12px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:200px\">行内动作、图标按钮命中区、紧凑表格行里的一切。文字 12 medium，内边距 12。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:.5px;background:rgba(0,0,0,.08)\"><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n        <div style=\"width:104px;flex:none\"><div style=\"font:600 12.5px/1.4 inherit;color:#0B8F84\">默认 28<\u002Fdiv><div style=\"font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">Control.default<\u002Fdiv><\u002Fdiv>\n        <div style=\"height:28px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.62);border:.5px solid rgba(0,0,0,.15);font:400 13px/1 inherit;color:#0B1826;flex:none\">重新扫描<\u002Fdiv>\n        <div style=\"height:28px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;gap:8px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.62);border:.5px solid rgba(0,0,0,.15);flex:none;white-space:nowrap\"><span style=\"font:400 13px/1 inherit;color:#0B1826\">最久未用<\u002Fspan><svg width=\"9\" height=\"11\" sc-camel-view-box=\"0 0 10 12\" fill=\"rgba(0,0,0,.45)\"><path d=\"M5 .8 8 4H2Z\"><\u002Fpath><path d=\"M5 11.2 2 8h6Z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"font:400 12px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:200px\">筛选行、报头插槽、选择条动作、Sheet 页脚、页签。文字 13，内边距 14。<strong style=\"font-weight:600;color:#0B1826\">90% 的控件是这一档。<\u002Fstrong><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:.5px;background:rgba(0,0,0,.08)\"><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n        <div style=\"width:104px;flex:none\"><div style=\"font:600 12.5px/1.4 inherit\">强调 36<\u002Fdiv><div style=\"font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">Control.emphasis<\u002Fdiv><\u002Fdiv>\n        <div style=\"height:36px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;padding:0 20px;border-radius:999px;background:linear-gradient(135deg,#11B3A4,#0B8F84 55%,#066A62);box-shadow:0 4px 14px rgba(11,143,132,.28);font:600 15px/1 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;color:#fff;flex:none\">去设置<\u002Fdiv>\n        <div style=\"font:400 12px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:200px\">卡内主动作：权限卡、完成卡、菜单栏面板。文字 15 semibold，内边距 20。取代 v1.0 的 32 档。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:.5px;background:rgba(0,0,0,.08)\"><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n        <div style=\"width:104px;flex:none\"><div style=\"font:600 12.5px/1.4 inherit\">英雄 44<\u002Fdiv><div style=\"font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">Control.hero<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;flex:none\">\n          <div style=\"height:44px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;gap:8px;padding:0 24px;border-radius:999px;background:linear-gradient(135deg,#11B3A4,#0B8F84 55%,#066A62);box-shadow:0 6px 18px rgba(11,143,132,.32);flex:none\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"#fff\"><path d=\"M8 1.6l1 2.6 2.6 1-2.6 1L8 8.8 7 6.2 4.4 5.2 7 4.2zM12.4 8.8l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6z\"><\u002Fpath><\u002Fsvg><span style=\"font:600 15px/1 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;color:#fff\">开始清理<\u002Fspan><\u002Fdiv>\n          <div style=\"height:44px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;padding:0 24px;border-radius:999px;background:rgba(255,255,255,.68);border:.5px solid rgba(0,0,0,.16);font:600 15px/1 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;color:#0B1826;flex:none\">看看有哪些<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font:400 12px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:200px\">每页最多一<em>组<\u002Fem>：概览英雄卡、清理摘要卡。<strong style=\"font-weight:600;color:#0B1826\">永不用于破坏性动作。<\u002Fstrong>同组按钮必须同档。<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:rgba(176,112,10,.09);border-radius:12px;padding:14px 16px;margin-top:20px\">\n      <div style=\"font:600 11.5px/1 inherit;color:#8A5708;margin-bottom:7px\">为什么 24 不能当默认档<\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap\">\n        <div style=\"display:flex;align-items:flex-end;gap:10px\">\n          <div style=\"text-align:center\"><div style=\"height:24px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.7);border:.5px solid rgba(206,59,54,.5);font:400 13px/1 inherit;color:#0B1826\">含系统自带<\u002Fdiv><div style=\"font:400 9.5px/1.5 ui-monospace,'SF Mono',Menlo,monospace;color:#CE3B36;margin-top:5px\">24 · 余量 5.5pt<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center\"><div style=\"height:28px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.7);border:.5px solid rgba(11,143,132,.5);font:400 13px/1 inherit;color:#0B1826\">含系统自带<\u002Fdiv><div style=\"font:400 9.5px/1.5 ui-monospace,'SF Mono',Menlo,monospace;color:#066A62;margin-top:5px\">28 · 余量 7.5pt<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font:400 12px/1.7 inherit;color:rgba(0,0,0,.62);margin:0;flex:1;min-width:220px\">中文字身没有升降部，占满整个字高。13pt 中文在 24 高胶囊里上下各剩 5.5pt，视觉上顶边；同样的胶囊放拉丁文字反而宽松。<strong style=\"font-weight:600;color:#0B1826\">照抄拉丁界面的控件高度，是中文 App 最常见的一类别扭。<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-bottom:14px\">\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:22px 24px\">\n      <div style=\"font:600 16px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:14px\">间距 <code style=\"font-weight:400\">Space<\u002Fcode><\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:6px;margin-bottom:12px\">\n        <div style=\"text-align:center\"><div style=\"width:2px;height:2px;background:#0B8F84;margin:0 auto 5px\"><\u002Fdiv><div style=\"font:400 9.5px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">2<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"width:4px;height:4px;background:#0B8F84;margin:0 auto 5px\"><\u002Fdiv><div style=\"font:400 9.5px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">4<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"width:8px;height:8px;background:#0B8F84;margin:0 auto 5px\"><\u002Fdiv><div style=\"font:400 9.5px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">8<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"width:12px;height:12px;background:#0B8F84;margin:0 auto 5px\"><\u002Fdiv><div style=\"font:400 9.5px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">12<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"width:16px;height:16px;background:#0B8F84;margin:0 auto 5px\"><\u002Fdiv><div style=\"font:400 9.5px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">16<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"width:24px;height:24px;background:#0B8F84;margin:0 auto 5px\"><\u002Fdiv><div style=\"font:400 9.5px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">24<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"width:32px;height:32px;background:#0B8F84;margin:0 auto 5px\"><\u002Fdiv><div style=\"font:400 9.5px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">32<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"width:48px;height:48px;background:#0B8F84;margin:0 auto 5px\"><\u002Fdiv><div style=\"font:400 9.5px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">48<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"margin:0;padding-left:15px;font:400 12px/1.8 inherit;color:rgba(0,0,0,.62)\">\n        <li>禁止算术：<code>Space.sm + 2<\u002Fcode>、<code>Space.lg + Space.xs<\u002Fcode>（现有 6 处）<\u002Fli>\n        <li>块间距 16 · 列表行距 8 · 栅格列距 12 · 内容列四周 32<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:22px 24px\">\n      <div style=\"font:600 16px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:14px\">圆角 <code style=\"font-weight:400\">Radius<\u002Fcode><\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px\">\n        <div style=\"text-align:center\"><div style=\"width:52px;height:34px;border-radius:999px;background:rgba(11,143,132,.16);border:.5px solid rgba(11,143,132,.4)\"><\u002Fdiv><div style=\"font:400 9.5px/1.6 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42);margin-top:4px\">pill<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"width:44px;height:34px;border-radius:22px;background:rgba(11,143,132,.16);border:.5px solid rgba(11,143,132,.4)\"><\u002Fdiv><div style=\"font:400 9.5px/1.6 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42);margin-top:4px\">panel 22<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"width:44px;height:34px;border-radius:16px;background:rgba(11,143,132,.16);border:.5px solid rgba(11,143,132,.4)\"><\u002Fdiv><div style=\"font:400 9.5px/1.6 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42);margin-top:4px\">card 16<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"width:44px;height:34px;border-radius:12px;background:rgba(11,143,132,.16);border:.5px solid rgba(11,143,132,.4)\"><\u002Fdiv><div style=\"font:400 9.5px/1.6 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42);margin-top:4px\">row 12<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"width:44px;height:34px;border-radius:8px;background:rgba(11,143,132,.16);border:.5px solid rgba(11,143,132,.4)\"><\u002Fdiv><div style=\"font:400 9.5px/1.6 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42);margin-top:4px\">chip 8<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"width:34px;height:34px;border-radius:4px;background:rgba(11,143,132,.16);border:.5px solid rgba(11,143,132,.4)\"><\u002Fdiv><div style=\"font:400 9.5px/1.6 ui-monospace,'SF Mono',Menlo,monospace;color:#0B8F84;margin-top:4px\">control 4 ✚<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"margin:0;padding-left:15px;font:400 12px/1.8 inherit;color:rgba(0,0,0,.62)\">\n        <li>同心律：子圆角 = 父圆角 − 父内边距（22 内 12 → 8）<\u002Fli>\n        <li>删除源码中所有圆角字面量（现有 9 / 7 / 6 / 5 / 2 / 1.5 / 1）<\u002Fli>\n        <li>复选框、图例方块、树图瓦片改 <code>control<\u002Fcode> 4<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:24px 26px;margin-bottom:14px\">\n    <div style=\"font:600 16px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:4px\">语义色 <code style=\"font-weight:400\">Palette<\u002Fcode><\u002Fdiv>\n    <p style=\"font:400 12.5px/1.7 inherit;color:rgba(0,0,0,.55);margin:0 0 18px;max-width:70ch\">色值不动（「深水」调色板已经很好），改的是<strong style=\"font-weight:600;color:#0B1826\">谁能用哪种颜色<\u002Fstrong>。两处与 v1.0 不同，用 ✚ 标出。<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:0\">\n      <div style=\"display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:.5px solid rgba(0,0,0,.07)\">\n        <div style=\"width:34px;height:22px;border-radius:6px;background:#0B1826;flex:none\"><\u002Fdiv>\n        <div style=\"width:112px;flex:none\"><div style=\"font:600 12.5px/1.4 inherit\">ink<\u002Fdiv><div style=\"font:400 10px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">#0B1826<\u002Fdiv><\u002Fdiv>\n        <div style=\"font:400 12px/1.6 inherit;color:rgba(0,0,0,.62);flex:1;min-width:180px\">主文字：标题、行标题、数值。<strong style=\"font-weight:600;color:#0B1826\">✚ 也是可逆删除动作的颜色<\u002Fstrong>（移到废纸篓）。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:.5px solid rgba(0,0,0,.07)\">\n        <div style=\"display:flex;flex:none\"><div style=\"width:11px;height:22px;background:rgba(0,0,0,.62)\"><\u002Fdiv><div style=\"width:11px;height:22px;background:rgba(0,0,0,.42)\"><\u002Fdiv><div style=\"width:12px;height:22px;background:rgba(0,0,0,.26)\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"width:112px;flex:none\"><div style=\"font:600 12.5px/1.4 inherit\">ink 三级<\u002Fdiv><div style=\"font:400 10px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">62 / 42 / 26%<\u002Fdiv><\u002Fdiv>\n        <div style=\"font:400 12px/1.6 inherit;color:rgba(0,0,0,.62);flex:1;min-width:180px\">支持句 / 标签与元数据 / 存在即可（路径、PID、占位）。<strong style=\"font-weight:600;color:#0B1826\">✚ 按钮文字禁止用 secondary 及以下<\u002Fstrong>。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:.5px solid rgba(0,0,0,.07)\">\n        <div style=\"width:34px;height:22px;border-radius:6px;background:linear-gradient(135deg,#11B3A4,#0B8F84 52%,#066A62);flex:none\"><\u002Fdiv>\n        <div style=\"width:112px;flex:none\"><div style=\"font:600 12.5px/1.4 inherit;color:#066A62\">aqua<\u002Fdiv><div style=\"font:400 10px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">#0B8F84<\u002Fdiv><\u002Fdiv>\n        <div style=\"font:400 12px/1.6 inherit;color:rgba(0,0,0,.62);flex:1;min-width:180px\">品牌 + 安全 + 选中 + 正向进度。唯一允许实心填充的强调色。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:.5px solid rgba(0,0,0,.07)\">\n        <div style=\"width:34px;height:22px;border-radius:6px;background:#1F6BD4;flex:none\"><\u002Fdiv>\n        <div style=\"width:112px;flex:none\"><div style=\"font:600 12.5px/1.4 inherit;color:#1F6BD4\">flow<\u002Fdiv><div style=\"font:400 10px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">#1F6BD4<\u002Fdiv><\u002Fdiv>\n        <div style=\"font:400 12px/1.6 inherit;color:rgba(0,0,0,.62);flex:1;min-width:180px\">可以点的文字。仅此一种含义——不再兼任信息色与次级图标色（v1.0 的 P12 指出了重叠但没有拆开）。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:.5px solid rgba(0,0,0,.07)\">\n        <div style=\"width:34px;height:22px;border-radius:6px;background:#B0700A;flex:none\"><\u002Fdiv>\n        <div style=\"width:112px;flex:none\"><div style=\"font:600 12.5px/1.4 inherit;color:#8A5708\">caution<\u002Fdiv><div style=\"font:400 10px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">#B0700A<\u002Fdiv><\u002Fdiv>\n        <div style=\"font:400 12px/1.6 inherit;color:rgba(0,0,0,.62);flex:1;min-width:180px\">需要看一眼：「建议看一眼」芯片、开机即启动、半年未用、温度异常、磁盘 &gt;90%。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:.5px solid rgba(0,0,0,.07)\">\n        <div style=\"width:34px;height:22px;border-radius:6px;background:#CE3B36;flex:none\"><\u002Fdiv>\n        <div style=\"width:112px;flex:none\"><div style=\"font:600 12.5px/1.4 inherit;color:#B8302B\">danger<\u002Fdiv><div style=\"font:400 10px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">#CE3B36<\u002Fdiv><\u002Fdiv>\n        <div style=\"font:400 12px/1.6 inherit;color:rgba(0,0,0,.62);flex:1;min-width:180px\"><strong style=\"font-weight:600;color:#0B1826\">✚ 只给不可逆<\u002Fstrong>：卸载、永久删除、结束进程、「请谨慎」芯片。可逆的删除不算。<strong style=\"font-weight:600;color:#0B1826\">列表中永不实心。<\u002Fstrong><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;padding:10px 0\">\n        <div style=\"width:34px;height:22px;border-radius:6px;background:#1C8A4E;flex:none\"><\u002Fdiv>\n        <div style=\"width:112px;flex:none\"><div style=\"font:600 12.5px/1.4 inherit;color:#1C8A4E\">positive<\u002Fdiv><div style=\"font:400 10px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">#1C8A4E<\u002Fdiv><\u002Fdiv>\n        <div style=\"font:400 12px/1.6 inherit;color:rgba(0,0,0,.62);flex:1;min-width:180px\">已完成的好结果：优化成功行、权限已授予、温度正常徽章。<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center\">\n      <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.1em;color:rgba(0,0,0,.42);text-transform:uppercase;margin-right:4px\">填充梯度<\u002Fdiv>\n      <div style=\"font:400 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.62);background:rgba(0,0,0,.045);border-radius:5px;padding:6px 9px\">井 5%<\u002Fdiv>\n      <div style=\"font:400 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.62);background:rgba(11,143,132,.06);border-radius:5px;padding:6px 9px\">悬停 6%<\u002Fdiv>\n      <div style=\"font:400 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.62);background:rgba(11,143,132,.08);border-radius:5px;padding:6px 9px\">选中 8%<\u002Fdiv>\n      <div style=\"font:400 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.62);background:rgba(11,143,132,.14);border-radius:5px;padding:6px 9px\">徽章与图标盒 14%<\u002Fdiv>\n      <div style=\"font:400 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.62);background:rgba(11,143,132,.12);border-radius:5px;padding:6px 9px\">卡片 tint 12%（仅 GlassCard）<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:24px 26px;margin-bottom:14px\">\n    <div style=\"font:600 16px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:4px\">字阶与角色 <code style=\"font-weight:400\">Typo<\u002Fcode><\u002Fdiv>\n    <p style=\"font:400 12.5px/1.7 inherit;color:rgba(0,0,0,.55);margin:0 0 20px;max-width:70ch\">11 级不变。改三件事：<code>Typo.Step<\u002Fcode> 收回 <code>Design/<\u002Fcode> 内部（页面不能再拼字重）；补齐 4 个 <code>*Numeric<\u002Fcode> 角色；每个场景指定唯一角色。下面是实际渲染。<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:0\">\n      <div style=\"display:flex;align-items:baseline;gap:16px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">hero 44 bold ⌀<\u002Fdiv><div style=\"font:700 44px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-variant-numeric:tabular-nums\">18.4<\u002Fdiv><div style=\"font:400 11.5px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:180px\">一页最多一个：清理摘要数字、水位环读数<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:16px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">feature 30 bold ⌀<\u002Fdiv><div style=\"font:700 30px/1.2 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif\">可以清出 124 GB<\u002Fdiv><div style=\"font:400 11.5px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:180px\">概览标题句<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:16px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">metric 24 bold ⌀<\u002Fdiv><div style=\"font:700 24px/1.2 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-variant-numeric:tabular-nums\">68.4 GB<\u002Fdiv><div style=\"font:400 11.5px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:180px\">统计卡值——<strong style=\"font-weight:600;color:#0B1826\">比页面标题大，故意的<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:16px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">pageTitle 20 bold ⌀<\u002Fdiv><div style=\"font:700 20px/1.2 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif\">应用<\u002Fdiv><div style=\"font:400 11.5px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:180px\">页面标题，仅报头行<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:16px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">cardTitle 17 semi ⌀<\u002Fdiv><div style=\"font:600 17px/1.2 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif\">这台机器很干净<\u002Fdiv><div style=\"font:400 11.5px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:180px\">Sheet 标题、空态标题<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:16px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">subhead 15 semi<\u002Fdiv><div style=\"font:600 15px/1.3 inherit\">浏览器缓存<\u002Fdiv><div style=\"font:400 11.5px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:180px\">分组行标题、英雄档按钮、<strong style=\"font-weight:600;color:#0B1826\">✚ 品牌字标（secondary 色）<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:16px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">body 13<\u002Fdiv><div style=\"font:400 13px/1.5 inherit\">看清每个 App 占了多少<\u002Fdiv><div style=\"font:400 11.5px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:180px\">页面副标题、卡内说明句、<strong style=\"font-weight:600;color:#0B1826\">✚ 所有默认档控件文字（含开关标签）<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:16px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">bodyStrong 13 semi<\u002Fdiv><div style=\"font:600 13px/1.5 inherit\">Final Cut Pro<\u002Fdiv><div style=\"font:400 11.5px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:180px\">标准行标题：应用名、任务名、大文件名<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:16px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:#0B8F84\">bodyNumeric 13 ⌀ ✚<\u002Fdiv><div style=\"font:600 13px/1.5 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-variant-numeric:tabular-nums\">3 / 142<\u002Fdiv><div style=\"font:400 11.5px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:180px\">选择条计数、Sheet 页脚合计<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:16px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">label 12 medium<\u002Fdiv><div style=\"font:500 12px/1.5 inherit\">全选<\u002Fdiv><div style=\"font:400 11.5px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:180px\">紧凑档按钮、文字按钮、紧凑行标题、统计卡标签<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:16px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">labelNumeric 12 ⌀<\u002Fdiv><div style=\"font:600 12px/1.5 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-variant-numeric:tabular-nums\">4.31<\u002Fdiv><div style=\"font:400 11.5px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:180px\">行内大小、「当前 xx」<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:16px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">caption 11<\u002Fdiv><div style=\"font:400 11px/1.5 inherit;color:rgba(0,0,0,.62)\">1 年 2 个月未打开 · 5.2.1<\u002Fdiv><div style=\"font:400 11.5px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:180px\">元数据、说明行、状态、脚注、<strong style=\"font-weight:600;color:#0B1826\">单位<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:16px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">overline 10 semi<\u002Fdiv><div style=\"font:600 10px/1.5 inherit;letter-spacing:.06em;color:rgba(0,0,0,.42)\">SECTION LABEL<\u002Fdiv><div style=\"font:400 11.5px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:180px\">区块标题、表头、徽章文字、图例标签<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:16px;padding:12px 0;flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:400 10.5px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">microMono 9<\u002Fdiv><div style=\"font:400 9px/1.5 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">~/Library/Caches/com.apple.FinalCut<\u002Fdiv><div style=\"font:400 11.5px/1.6 inherit;color:rgba(0,0,0,.55);flex:1;min-width:180px\">路径、PID<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:rgba(0,0,0,.04);border-radius:12px;padding:15px 17px;margin-top:18px\">\n      <div style=\"font:600 11.5px/1 inherit;margin-bottom:9px\">✚ 中英混排规则（v1.0 缺）<\u002Fdiv>\n      <ul style=\"margin:0;padding-left:15px;font:400 12px/1.85 inherit;color:rgba(0,0,0,.68)\">\n        <li>行高：中文正文 <strong style=\"font-weight:600\">1.7<\u002Fstrong>，拉丁 1.5；单行控件文字 <code>line-height: 1<\u002Fcode> 由容器居中<\u002Fli>\n        <li>字重上限：中文<strong style=\"font-weight:600\">最重到 semibold<\u002Fstrong>；<code>bold<\u002Fcode> 只给 rounded 数字与页面标题（<code>PingFang<\u002Fcode> 的 bold 在小字号下糊成一团）<\u002Fli>\n        <li>禁止中文用 <code>light<\u002Fcode> / <code>thin<\u002Fcode>，禁止中文加 <code>letter-spacing<\u002Fcode>；tracking 只给全大写拉丁 <code>overline<\u002Fcode><\u002Fli>\n        <li>控件内垂直余量 ≥ 7pt ⇒ 13pt 文字的控件最低 28 高<\u002Fli>\n        <li>所有 <code>frame(width:)<\u002Fcode> 的文字列按中文量（中文比英文宽约 15%）<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:24px 26px;margin-bottom:52px\">\n    <div style=\"font:600 16px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:4px\">字形与图标盒 <code style=\"font-weight:400\">Glyph<\u002Fcode><\u002Fdiv>\n    <p style=\"font:400 12.5px/1.7 inherit;color:rgba(0,0,0,.55);margin:0 0 18px;max-width:70ch\">图标尺寸不再借 <code>Typo.Step<\u002Fcode>。图标盒只有四种，每种有唯一归属。<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;margin-bottom:18px\">\n      <div style=\"text-align:center\"><div style=\"width:24px;height:24px;border-radius:6px;background:rgba(11,143,132,.14);display:flex;align-items:center;justify-content:center;margin:0 auto\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#066A62\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M3 8h10M8 3v10\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font:400 9.5px/1.6 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42);margin-top:6px\">24 · r6<\u002Fdiv><div style=\"font:400 10px/1.5 inherit;color:rgba(0,0,0,.55)\">菜单栏品牌<\u002Fdiv><\u002Fdiv>\n      <div style=\"text-align:center\"><div style=\"width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#11B3A4,#066A62);display:flex;align-items:center;justify-content:center;margin:0 auto\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"#fff\"><path d=\"M3 12c3-4.2 7-6.2 11-6.2 2.1 0 3.9.6 5.3 1.7l1.2-1.4c.3-.3.8-.1.8.3v11.2c0 .4-.5.6-.8.3l-1.2-1.4A8.7 8.7 0 0 1 14 18.2C10 18.2 6 16.2 3 12Zm12.6-2.2a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6Z\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font:400 9.5px/1.6 ui-monospace,'SF Mono',Menlo,monospace;color:#0B8F84;margin-top:6px\">28 · r8 ✚<\u002Fdiv><div style=\"font:400 10px/1.5 inherit;color:rgba(0,0,0,.55)\">报头品牌（= 带高）<\u002Fdiv><\u002Fdiv>\n      <div style=\"text-align:center\"><div style=\"width:32px;height:32px;border-radius:8px;background:rgba(176,112,10,.14);display:flex;align-items:center;justify-content:center;margin:0 auto\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#8A5708\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M8 2.6 14 13H2z\"><\u002Fpath><path d=\"M8 6.6v3M8 11.2v.1\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font:400 9.5px/1.6 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42);margin-top:6px\">32 · r8<\u002Fdiv><div style=\"font:400 10px/1.5 inherit;color:rgba(0,0,0,.55)\">类别、横幅、行内应用图标<\u002Fdiv><\u002Fdiv>\n      <div style=\"text-align:center\"><div style=\"width:44px;height:44px;border-radius:12px;background:rgba(206,59,54,.13);display:flex;align-items:center;justify-content:center;margin:0 auto\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#B8302B\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M3 5.5h10M4.5 5.5v7a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1v-7M6.4 5.5V4a1 1 0 0 1 1-1h1.2a1 1 0 0 1 1 1v1.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font:400 9.5px/1.6 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42);margin-top:6px\">44 · r12<\u002Fdiv><div style=\"font:400 10px/1.5 inherit;color:rgba(0,0,0,.55)\">Sheet 头部<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:1;min-width:200px;font:400 12px/1.75 inherit;color:rgba(0,0,0,.62)\">现状是 44 / 34 / 32 / 30 / 22 配圆角 12 / 9 / 8 / 8 / 6——五种尺寸五种圆角，没有一条对应关系。收成四种后，<strong style=\"font-weight:600;color:#0B1826\">圆角 = 盒宽 ÷ 3.6<\u002Fstrong>（同心律的近似），新增尺寸时不用再猜。<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n      <div style=\"font:400 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.62);background:rgba(0,0,0,.045);border-radius:5px;padding:6px 9px\">badge 9<\u002Fdiv>\n      <div style=\"font:400 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.62);background:rgba(0,0,0,.045);border-radius:5px;padding:6px 9px\">caption 11<\u002Fdiv>\n      <div style=\"font:400 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.62);background:rgba(0,0,0,.045);border-radius:5px;padding:6px 9px\">control 13<\u002Fdiv>\n      <div style=\"font:400 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.62);background:rgba(0,0,0,.045);border-radius:5px;padding:6px 9px\">row 15<\u002Fdiv>\n      <div style=\"font:400 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.62);background:rgba(0,0,0,.045);border-radius:5px;padding:6px 9px\">card 17<\u002Fdiv>\n      <div style=\"font:400 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.62);background:rgba(0,0,0,.045);border-radius:5px;padding:6px 9px\">title 20<\u002Fdiv>\n      <div style=\"font:400 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.62);background:rgba(0,0,0,.045);border-radius:5px;padding:6px 9px\">feature 30<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"destructive\" style=\"scroll-margin-top:20px\">\n    <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.12em;color:#B8302B;text-transform:uppercase;margin:0 0 8px\">第五部分 · 核心提案<\u002Fdiv>\n    <h2 style=\"font:600 24px/1.3 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;margin:0 0 8px\">破坏性与可逆性的视觉语法<\u002Fh2>\n    <p style=\"font:400 13.5px/1.7 inherit;color:rgba(0,0,0,.55);margin:0 0 20px;max-width:68ch\">这是 v1.0 完全没有的一节，也是我认为最该加的一节。README 第一段承诺了「破坏性按钮不是最显眼的那个」，但代码里 <code>PrimaryButtonStyle(tint: .danger)<\u002Fcode> 让它成为了最显眼的那个。规则要能兑现承诺。<\u002Fp>\n\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:24px 26px;margin-bottom:14px\">\n      <div style=\"font:600 15px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:4px\">两条硬规则<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-top:16px\">\n        <div style=\"background:rgba(206,59,54,.07);border:.5px solid rgba(206,59,54,.22);border-radius:14px;padding:16px 18px\">\n          <div style=\"font:600 12.5px/1.5 inherit;color:#B8302B;margin-bottom:8px\">规则一 · 实心只给「可逆的好事」<\u002Fdiv>\n          <p style=\"font:400 12.5px/1.75 inherit;color:rgba(0,0,0,.68);margin:0\">实心填充是页面上最响的东西，只用于<strong style=\"font-weight:600\">让用户变好、且做错了能撤回<\u002Fstrong>的动作——「开始清理」（东西进废纸篓）、「移到废纸篓」（可还原）。<strong style=\"font-weight:600\">列表与工具条里的破坏性动作永远是描边<\u002Fstrong>：danger 描边 1pt + danger 文字 + danger 6% 底。<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:rgba(206,59,54,.07);border:.5px solid rgba(206,59,54,.22);border-radius:14px;padding:16px 18px\">\n          <div style=\"font:600 12.5px/1.5 inherit;color:#B8302B;margin-bottom:8px\">规则二 · 实心 danger 只活在确认里<\u002Fdiv>\n          <p style=\"font:400 12.5px/1.75 inherit;color:rgba(0,0,0,.68);margin:0\">唯一允许实心 danger 的地方是<strong style=\"font-weight:600\">确认 Sheet / Alert 的确认键<\u002Fstrong>——此时用户已明确表达意图，并且那个界面里没有别的实心块与它竞争。<strong style=\"font-weight:600\">一个界面最多一个实心色块。<\u002Fstrong><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:24px 26px;margin-bottom:14px\">\n      <div style=\"font:600 15px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:16px\">四种形态 · 按可逆性分配<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:0\">\n        <div style=\"display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\">\n          <div style=\"width:170px;flex:none;display:flex;justify-content:flex-start\">\n            <div style=\"height:44px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;gap:8px;padding:0 24px;border-radius:999px;background:linear-gradient(135deg,#11B3A4,#0B8F84 55%,#066A62);box-shadow:0 6px 18px rgba(11,143,132,.3)\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"#fff\"><path d=\"M8 1.6l1 2.6 2.6 1-2.6 1L8 8.8 7 6.2 4.4 5.2 7 4.2z\"><\u002Fpath><\u002Fsvg><span style=\"font:600 15px/1 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;color:#fff\">开始清理<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:120px;flex:none\"><div style=\"font:600 11.5px/1.5 inherit;color:#1C8A4E\">可逆 · 好事<\u002Fdiv><div style=\"font:400 10px/1.5 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">实心 aqua<\u002Fdiv><\u002Fdiv>\n          <div style=\"font:400 12px/1.7 inherit;color:rgba(0,0,0,.62);flex:1;min-width:200px\">英雄档 44。东西进废纸篓，做错了走一趟废纸篓就好。<strong style=\"font-weight:600;color:#0B1826\">白字 / aqua 实心 = 4.9:1，达标。<\u002Fstrong>清理页摘要卡的「移到废纸篓」同形态。<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\">\n          <div style=\"width:170px;flex:none;display:flex;justify-content:flex-start\">\n            <div style=\"height:28px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;gap:7px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.62);border:.5px solid rgba(0,0,0,.18)\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#0B1826\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M3 5.5h10M4.5 5.5v7a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1v-7\"><\u002Fpath><\u002Fsvg><span style=\"font:400 13px/1 inherit;color:#0B1826\">移到废纸篓<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:120px;flex:none\"><div style=\"font:600 11.5px/1.5 inherit;color:#0B1826\">可逆 · 中性<\u002Fdiv><div style=\"font:400 10px/1.5 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">描边 ink<\u002Fdiv><\u002Fdiv>\n          <div style=\"font:400 12px/1.7 inherit;color:rgba(0,0,0,.62);flex:1;min-width:200px\"><strong style=\"font-weight:600;color:#0B1826\">✚ 现状用的是 danger，我改成中性。<\u002Fstrong>把可还原的动作染成红色，等于教用户忽略红色——真正不可逆的地方就没有词可用了。大文件行、清理条目行用这一档。<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\">\n          <div style=\"width:170px;flex:none;display:flex;justify-content:flex-start\">\n            <div style=\"height:28px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;gap:7px;padding:0 14px;border-radius:999px;background:rgba(206,59,54,.06);border:1px solid rgba(206,59,54,.5)\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#B8302B\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M3 5.5h10M4.5 5.5v7a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1v-7M6.4 5.5V4a1 1 0 0 1 1-1h1.2a1 1 0 0 1 1 1v1.5\"><\u002Fpath><\u002Fsvg><span style=\"font:500 13px/1 inherit;color:#B8302B\">卸载所选<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:120px;flex:none\"><div style=\"font:600 11.5px/1.5 inherit;color:#B8302B\">不可逆 · 提议<\u002Fdiv><div style=\"font:400 10px/1.5 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">描边 danger<\u002Fdiv><\u002Fdiv>\n          <div style=\"font:400 12px/1.7 inherit;color:rgba(0,0,0,.62);flex:1;min-width:200px\">默认档 28。卸载、结束进程、清空开机项。<strong style=\"font-weight:600;color:#0B1826\">danger 文字压浅底 = 5.1:1，比原来的白压粉红（2.6:1）好一倍。<\u002Fstrong>点它不执行，只打开确认。<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap\">\n          <div style=\"width:170px;flex:none;display:flex;justify-content:flex-start\">\n            <div style=\"height:28px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;padding:0 16px;border-radius:999px;background:#C0342F;box-shadow:0 3px 10px rgba(206,59,54,.28)\"><span style=\"font:600 13px/1 inherit;color:#fff\">永久删除 3 项<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:120px;flex:none\"><div style=\"font:600 11.5px/1.5 inherit;color:#B8302B\">不可逆 · 确认<\u002Fdiv><div style=\"font:400 10px/1.5 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42)\">实心 danger<\u002Fdiv><\u002Fdiv>\n          <div style=\"font:400 12px/1.7 inherit;color:rgba(0,0,0,.62);flex:1;min-width:200px\"><strong style=\"font-weight:600;color:#0B1826\">只在 Sheet / Alert 里。<\u002Fstrong>底色用 <code>danger<\u002Fcode> 的深值（浅色 <code>#C0342F<\u002Fcode>，白字 4.6:1），不是 12% 玻璃 tint——玻璃 tint 是那颗粉红按钮对比度不足的直接原因。按钮文案带上数量，让确认有内容。<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:52px\">\n      <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:22px 24px\">\n        <div style=\"font:600 14px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:14px\">唯一允许实心 danger 的界面<\u002Fdiv>\n        <div style=\"border-radius:14px;overflow:hidden;border:.5px solid rgba(0,0,0,.12);background:linear-gradient(180deg,#F3F8FB,#E4EEF7)\">\n          <div style=\"padding:20px 20px 16px\">\n            <div style=\"display:flex;align-items:flex-start;gap:14px;margin-bottom:16px\">\n              <div style=\"width:44px;height:44px;border-radius:12px;background:rgba(206,59,54,.13);display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#B8302B\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M3 5.5h10M4.5 5.5v7a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1v-7M6.4 5.5V4a1 1 0 0 1 1-1h1.2a1 1 0 0 1 1 1v1.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <div style=\"min-width:0\">\n                <div style=\"font:600 17px/1.3 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;color:#0B1826;margin-bottom:4px\">卸载 3 个应用<\u002Fdiv>\n                <div style=\"font:400 12px/1.6 inherit;color:rgba(0,0,0,.62)\">连同它们留在别处的 14 项残留。全部进废纸篓，可以还原。<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:rgba(0,0,0,.04);border-radius:12px;padding:8px 10px;margin-bottom:16px\">\n              <div style=\"display:flex;align-items:center;gap:10px;height:40px\"><div style=\"width:16px;height:16px;border-radius:4px;background:linear-gradient(135deg,#11B3A4,#066A62);flex:none\"><\u002Fdiv><div style=\"flex:1;min-width:0\"><div style=\"font:500 12px/1.4 inherit\">Final Cut Pro<\u002Fdiv><div style=\"font:400 9px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">/Applications/Final Cut Pro.app<\u002Fdiv><\u002Fdiv><span style=\"font:600 12px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-variant-numeric:tabular-nums\">4.31<\u002Fspan><span style=\"font:400 11px/1 inherit;color:rgba(0,0,0,.42)\">GB<\u002Fspan><\u002Fdiv>\n              <div style=\"height:.5px;background:rgba(0,0,0,.07)\"><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:10px;height:40px\"><div style=\"width:16px;height:16px;border-radius:4px;background:linear-gradient(135deg,#11B3A4,#066A62);flex:none\"><\u002Fdiv><div style=\"flex:1;min-width:0\"><div style=\"font:500 12px/1.4 inherit\">Xcode<\u002Fdiv><div style=\"font:400 9px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">~/Library/Developer/Xcode/DerivedData<\u002Fdiv><\u002Fdiv><span style=\"font:600 12px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-variant-numeric:tabular-nums\">12.7<\u002Fspan><span style=\"font:400 11px/1 inherit;color:rgba(0,0,0,.42)\">GB<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <div><span style=\"font:600 13px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#0B1826\">18.4<\u002Fspan> <span style=\"font:400 11px/1 inherit;color:rgba(0,0,0,.42)\">GB 将被移走<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <div style=\"height:28px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.7);border:.5px solid rgba(0,0,0,.18);font:400 13px/1 inherit;color:#0B1826\">取消<\u002Fdiv>\n              <div style=\"height:28px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;padding:0 16px;border-radius:999px;background:#C0342F;box-shadow:0 3px 10px rgba(206,59,54,.26);font:600 13px/1 inherit;color:#fff\">卸载 3 个<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font:400 11.5px/1.7 inherit;color:rgba(0,0,0,.55);margin:12px 0 0\">页脚两键同为默认档 28，确认键实心。整个 Sheet 里只有这一个实心色块。<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:22px 24px\">\n        <div style=\"font:600 14px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:4px\">✚ 玻璃控件的最小可辨度<\u002Fdiv>\n        <p style=\"font:400 12px/1.7 inherit;color:rgba(0,0,0,.55);margin:0 0 14px\">在浅色「深水」地上，<code>.ultraThinMaterial<\u002Fcode> + 0.5pt hairline 几乎看不出边界——你的第 5 张截图里，「看看有哪些」的边缘就基本消失了。规则：<strong style=\"font-weight:600;color:#0B1826\">任何可点的玻璃控件必须同时具备白色填充底 ≥ 8% 和 0.5pt 描边 ≥ 14%<\u002Fstrong>，且文字不低于 <code>ink<\u002Fcode>。<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"background:linear-gradient(120deg,#DCEDE9,#D9E8F4);border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n            <div style=\"height:28px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.14);border:.5px solid rgba(0,0,0,.05);font:400 13px/1 inherit;color:rgba(0,0,0,.62)\">看看有哪些<\u002Fdiv>\n            <div style=\"font:400 10.5px/1.5 ui-monospace,'SF Mono',Menlo,monospace;color:#CE3B36\">现状 · 边界不可见<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:linear-gradient(120deg,#DCEDE9,#D9E8F4);border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n            <div style=\"height:28px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.66);border:.5px solid rgba(0,0,0,.16);font:400 13px/1 inherit;color:#0B1826\">看看有哪些<\u002Fdiv>\n            <div style=\"font:400 10.5px/1.5 ui-monospace,'SF Mono',Menlo,monospace;color:#066A62\">本标准 · 66% 白底 + 16% 描边<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <ul style=\"margin:14px 0 0;padding-left:15px;font:400 11.5px/1.8 inherit;color:rgba(0,0,0,.62)\">\n          <li>非交互的玻璃面板可以更透（卡片 55%），可点的不行<\u002Fli>\n          <li>玻璃控件不得直接压在 aurora 色场最亮处；英雄卡内例外（卡本身已是一层玻璃）<\u002Fli>\n          <li>macOS 15 回退分支与 26 的 <code>glassEffect<\u002Fcode> 都要满足这条——现状只有回退分支画了 hairline<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.12em;color:rgba(0,0,0,.42);text-transform:uppercase;margin:0 0 8px\">第六部分<\u002Fdiv>\n  <h2 style=\"font:600 24px/1.3 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;margin:0 0 8px\">组件<\u002Fh2>\n  <p style=\"font:400 13.5px/1.7 inherit;color:rgba(0,0,0,.55);margin:0 0 22px;max-width:68ch\">一种东西一个组件，页面只选参数、不改外观。下面每一张都是可量的样张。<\u002Fp>\n\n  <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:24px 26px;margin-bottom:14px\">\n    <div style=\"font:600 16px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:4px\">按钮 · 三角色 × 四档<\u002Fdiv>\n    <p style=\"font:400 12.5px/1.7 inherit;color:rgba(0,0,0,.55);margin:0 0 20px;max-width:70ch\">角色决定形态与颜色，档位决定尺寸。<strong style=\"font-weight:600;color:#0B1826\">同一组按钮必须同档<\u002Fstrong>（概览两颗都是英雄档，Sheet 页脚两颗都是默认档）。灰格 = 不存在的组合。<\u002Fp>\n\n    <div style=\"display:flex;flex-direction:column;gap:0\">\n      <div style=\"display:flex;gap:14px;padding-bottom:10px;border-bottom:.5px solid rgba(0,0,0,.1);flex-wrap:wrap\">\n        <div style=\"width:104px;flex:none\"><\u002Fdiv>\n        <div style=\"flex:1;min-width:132px;font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;color:rgba(0,0,0,.42);text-transform:uppercase\">紧凑 24<\u002Fdiv>\n        <div style=\"flex:1;min-width:140px;font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;color:#0B8F84;text-transform:uppercase\">默认 28<\u002Fdiv>\n        <div style=\"flex:1;min-width:140px;font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;color:rgba(0,0,0,.42);text-transform:uppercase\">强调 36<\u002Fdiv>\n        <div style=\"flex:1;min-width:168px;font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;color:rgba(0,0,0,.42);text-transform:uppercase\">英雄 44<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\">\n        <div style=\"width:104px;flex:none\"><div style=\"font:600 12.5px/1.4 inherit\">Primary<\u002Fdiv><div style=\"font:400 10px/1.5 inherit;color:rgba(0,0,0,.42)\">实心 · 白字<br>仅 aqua<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;min-width:132px\"><div style=\"font:400 10.5px/1.5 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.26)\">不存在<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;min-width:140px\"><div style=\"height:28px;box-sizing:border-box;display:inline-flex;align-items:center;white-space:nowrap;flex:none;padding:0 14px;border-radius:999px;background:linear-gradient(135deg,#11B3A4,#0B8F84 55%,#066A62);box-shadow:0 3px 10px rgba(11,143,132,.26);font:600 13px/1 inherit;color:#fff\">卸载 3 个<\u002Fdiv><div style=\"font:400 10px/1.5 inherit;color:rgba(0,0,0,.42);margin-top:5px\">Sheet 确认键<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;min-width:140px\"><div style=\"height:36px;box-sizing:border-box;display:inline-flex;align-items:center;white-space:nowrap;flex:none;padding:0 20px;border-radius:999px;background:linear-gradient(135deg,#11B3A4,#0B8F84 55%,#066A62);box-shadow:0 4px 14px rgba(11,143,132,.28);font:600 15px/1 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;color:#fff\">去设置<\u002Fdiv><div style=\"font:400 10px/1.5 inherit;color:rgba(0,0,0,.42);margin-top:5px\">权限卡 · 完成卡<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;min-width:168px\"><div style=\"height:44px;box-sizing:border-box;display:inline-flex;align-items:center;white-space:nowrap;flex:none;padding:0 24px;border-radius:999px;background:linear-gradient(135deg,#11B3A4,#0B8F84 55%,#066A62);box-shadow:0 6px 18px rgba(11,143,132,.3);font:600 15px/1 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;color:#fff\">开始清理<\u002Fdiv><div style=\"font:400 10px/1.5 inherit;color:rgba(0,0,0,.42);margin-top:5px\">每页最多一组<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\">\n        <div style=\"width:104px;flex:none\"><div style=\"font:600 12.5px/1.4 inherit\">Secondary<\u002Fdiv><div style=\"font:400 10px/1.5 inherit;color:rgba(0,0,0,.42)\">描边 · ink 字<br>可换 danger<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;min-width:132px -items:center;white-space:nowrap;flex:none;padding:0 6px;border-radius:999px;background:rgba(109,59,209,.14)\"><span style=\"font:600 9px/1 inherit;color:#5A2FB8\">系统<\u002Fspan><\u002Fspan>\n            <span style=\"width:16px;height:16px;box-sizing:border-box;display:inline-flex;align-items:center;white-space:nowrap;flex:none;justify-content:center;border-radius:999px;background:rgba(11,143,132,.14)\"><svg width=\"8\" height=\"8\" sc-camel-view-box=\"0 0 12 12\" fill=\"#066A62\"><path d=\"M6 1 7.4 4l3.1.3-2.3 2 .7 3-2.9-1.6L3.1 9.3l.7-3-2.3-2L4.6 4z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <span style=\"height:16px;box-sizing:border-box;display:inline-flex;align-items:center;white-space:nowrap;flex:none;gap:3px;padding:0 6px;border-radius:999px;background:rgba(28,138,78,.14)\"><svg width=\"8\" height=\"8\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\" stroke=\"#1C8A4E\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M2 6.2 4.5 8.8 10 3.2\"><\u002Fpath><\u002Fsvg><span style=\"font:600 9px/1 inherit;color:#1C8A4E\">已修复<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font:400 11px/1.7 inherit;color:rgba(0,0,0,.55);margin:14px 0 0\">两种样式：<strong style=\"font-weight:600;color:#0B1826\">着色<\u002Fstrong>（tint 14% 底 + tint 字）与<strong style=\"font-weight:600;color:#0B1826\">中性<\u002Fstrong>（<code>wellFill<\u002Fcode> 底 + <code>inkTertiary<\u002Fcode> 字）。<code>CountPill<\u002Fcode> 归入 <code>Badge.count<\u002Fcode>。排名圆标保留 20 圆。<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:22px 24px\">\n      <div style=\"font:600 15px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:4px\">✚ 数字排版<\u002Fdiv>\n      <p style=\"font:400 12px/1.7 inherit;color:rgba(0,0,0,.55);margin:0 0 14px\">v1.0 补了 <code>*Numeric<\u002Fcode> 角色，但没定怎么排。这一节全新。<\u002Fp>\n      <div style=\"background:rgba(0,0,0,.035);border-radius:12px;padding:16px;margin-bottom:14px\">\n        <div style=\"display:flex;align-items:baseline;gap:4px;margin-bottom:10px\"><span style=\"font:700 44px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#0B1826\">124<\u002Fspan><span style=\"font:600 17px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;color:rgba(0,0,0,.42);margin-left:2px\">GB<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:20px;flex-wrap:wrap\">\n          <div><span style=\"font:700 24px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-variant-numeric:tabular-nums\">68.4<\u002Fspan> <span style=\"font:400 11px/1 inherit;color:rgba(0,0,0,.42)\">GB<\u002Fspan><\u002Fdiv>\n          <div><span style=\"font:600 13px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-variant-numeric:tabular-nums\">18.4<\u002Fspan> <span style=\"font:400 11px/1 inherit;color:rgba(0,0,0,.42)\">GB<\u002Fspan><\u002Fdiv>\n          <div><span style=\"font:600 12px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-variant-numeric:tabular-nums\">612<\u002Fspan> <span style=\"font:400 11px/1 inherit;color:rgba(0,0,0,.42)\">MB<\u002Fspan><\u002Fdiv>\n          <div><span style=\"font:400 11px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:rgba(0,0,0,.62)\">8.4<\u002Fspan> <span style=\"font:400 11px/1 inherit;color:rgba(0,0,0,.42)\">%<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"margin:0;padding-left:15px;font:400 11.5px/1.85 inherit;color:rgba(0,0,0,.68)\">\n        <li><strong style=\"font-weight:600\">数值与单位分离<\u002Fstrong>：单位降到 <code>caption<\u002Fcode> + <code>inkTertiary<\u002Fcode>，中间 4pt。「4.31 GB」不是一个词，是一个量和一把尺<\u002Fli>\n        <li><strong style=\"font-weight:600\">一律等宽数位<\u002Fstrong> <code>.monospacedDigit()<\u002Fcode>；会变的数字加 <code>.contentTransition(.numericText())<\u002Fcode><\u002Fli>\n        <li><strong style=\"font-weight:600\">精度分档<\u002Fstrong>：&lt; 10 保留两位（4.31）· 10–99 保留一位（18.4）· ≥ 100 取整（612）。同一列精度一致<\u002Fli>\n        <li><strong style=\"font-weight:600\">十进制单位<\u002Fstrong>，与访达一致（README 已承诺）；不做千分位分隔<\u002Fli>\n        <li><strong style=\"font-weight:600\">列右对齐、固定宽 80<\u002Fstrong>（中文量）；不可用的量写「不可用」，不估算<\u002Fli>\n        <li>大号读数（hero / metric）的单位与数值<strong style=\"font-weight:600\">基线对齐<\u002Fstrong>，不居中<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.12em;color:rgba(0,0,0,.42);text-transform:uppercase;margin:0 0 8px\">第七部分<\u002Fdiv>\n  <h2 style=\"font:600 24px/1.3 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;margin:0 0 8px\">页面骨架 · 可继承<\u002Fh2>\n  <p style=\"font:400 13.5px/1.7 inherit;color:rgba(0,0,0,.55);margin:0 0 22px;max-width:68ch\">位置、缩进、间距由骨架决定，页面只填内容。<strong style=\"font-weight:600;color:#0B1826\">页面不产生新样式<\u002Fstrong>——需要表里没有的东西，先在 <code>Design/<\u002Fcode> 里加，再在页面里用。<\u002Fp>\n\n  <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:24px 26px;margin-bottom:14px\">\n    <div style=\"font:600 16px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:4px\">报头行 <code style=\"font-weight:400\">Masthead<\u002Fcode><\u002Fdiv>\n    <p style=\"font:400 12.5px/1.7 inherit;color:rgba(0,0,0,.55);margin:0 0 16px;max-width:70ch\">侧栏与内容列共享一条 28 高的带子，从标题栏下缘起 12pt。<strong style=\"font-weight:600;color:#0B1826\">带内所有文字按基线对齐，基线落在带底 −7（= 标题栏下缘 +33）。<\u002Fstrong><\u002Fp>\n    <div style=\"overflow-x:auto\">\n      <div style=\"min-width:520px\">\n        <div style=\"display:flex;gap:12px;padding:0 0 8px;border-bottom:.5px solid rgba(0,0,0,.1)\">\n          <div style=\"width:96px;flex:none;font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;color:rgba(0,0,0,.42);text-transform:uppercase\">列<\u002Fdiv>\n          <div style=\"flex:1.4;font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;color:rgba(0,0,0,.42);text-transform:uppercase\">内容<\u002Fdiv>\n          <div style=\"flex:1;font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;color:rgba(0,0,0,.42);text-transform:uppercase\">角色<\u002Fdiv>\n          <div style=\"flex:1;font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;color:rgba(0,0,0,.42);text-transform:uppercase\">位置（标题栏下缘 = 0）<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:12px;padding:11px 0;border-bottom:.5px solid rgba(0,0,0,.06);font:400 12px/1.6 inherit\"><div style=\"width:96px;flex:none;color:rgba(0,0,0,.62)\">侧栏<\u002Fdiv><div style=\"flex:1.4\">图标盒 28（r8）+「MacPleco」<\u002Fdiv><div style=\"flex:1;color:rgba(0,0,0,.62)\"><code>subhead<\u002Fcode> 15 semi · secondary<\u002Fdiv><div style=\"flex:1;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:rgba(0,0,0,.62)\">x 24 · 基线 +33<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;padding:11px 0;border-bottom:.5px solid rgba(0,0,0,.06);font:400 12px/1.6 inherit\"><div style=\"width:96px;flex:none;color:rgba(0,0,0,.62)\">内容列<\u002Fdiv><div style=\"flex:1.4\">页面标题<\u002Fdiv><div style=\"flex:1;color:rgba(0,0,0,.62)\"><code>pageTitle<\u002Fcode> 20 bold · ink<\u002Fdiv><div style=\"flex:1;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:rgba(0,0,0,.62)\">x 284 · 基线 +33<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;padding:11px 0;border-bottom:.5px solid rgba(0,0,0,.06);font:400 12px/1.6 inherit\"><div style=\"width:96px;flex:none;color:rgba(0,0,0,.62)\">内容列右<\u002Fdiv><div style=\"flex:1.4\">插槽：<strong style=\"font-weight:600\">恰好一个控件，永不放导航<\u002Fstrong><\u002Fdiv><div style=\"flex:1;color:rgba(0,0,0,.62)\">默认档 28 Secondary<\u002Fdiv><div
