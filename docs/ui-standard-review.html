下 24<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:rgba(0,0,0,.04);border-radius:12px;padding:14px 16px;margin-top:16px;font:400 11.5px/1.8 inherit;color:rgba(0,0,0,.68)\">\n      <strong style=\"font-weight:600;color:#0B1826\">落到代码：<\u002Fstrong><code>Page<\u002Fcode> 上边距 24 → 12；标题与字标各自外包 <code>.frame(height: 28, alignment: .bottom)<\u002Fcode> 并用 <code>.alignmentGuide(.firstTextBaseline)<\u002Fcode> 锚定；侧栏品牌行左右内边距 20 → <strong style=\"font-weight:600;color:#0B1826\">24<\u002Fstrong>（与导航项标签同一条左边线，修 v1.0 的 P11）；图标 30 → 28。\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:24px 26px;margin-bottom:14px\">\n    <div style=\"font:600 16px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:16px\">三个页面模板<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px\">\n      <div style=\"background:rgba(0,0,0,.035);border-radius:14px;padding:16px 18px\">\n        <div style=\"font:600 12.5px/1.4 inherit;margin-bottom:4px\">仪表页<\u002Fdiv>\n        <div style=\"font:400 10.5px/1.5 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42);margin-bottom:12px\">概览 · 监控<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px;font:400 11.5px/1.5 inherit;color:rgba(0,0,0,.68)\">\n          <div style=\"background:rgba(11,143,132,.14);border-radius:6px;padding:5px 8px\">报头<\u002Fdiv>\n          <div style=\"background:rgba(255,255,255,.7);border-radius:6px;padding:9px 8px\">英雄卡 或 仪表网格<\u002Fdiv>\n          <div style=\"display:flex;gap:5px\"><div style=\"flex:1;background:rgba(255,255,255,.7);border-radius:6px;padding:5px 8px;text-align:center\">卡<\u002Fdiv><div style=\"flex:1;background:rgba(255,255,255,.7);border-radius:6px;padding:5px 8px;text-align:center\">卡<\u002Fdiv><div style=\"flex:1;background:rgba(255,255,255,.7);border-radius:6px;padding:5px 8px;text-align:center\">卡<\u002Fdiv><div style=\"flex:1;background:rgba(255,255,255,.7);border-radius:6px;padding:5px 8px;text-align:center\">卡<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:rgba(255,255,255,.7);border-radius:6px;padding:5px 8px\">信息条 / 列表卡<\u002Fdiv>\n          <div style=\"background:rgba(0,0,0,.04);border-radius:6px;padding:4px 8px;font-size:10.5px\">脚注<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font:400 11px/1.7 inherit;color:rgba(0,0,0,.55);margin:12px 0 0\">统计卡网格统一最小宽 <strong style=\"font-weight:600;color:#0B1826\">224<\u002Fstrong>（现有 224 / 236 两种）。内容列 ≤ 908 时四卡 2×2，≥ 920 时 4×1——默认 1200 窗口是 2×2，这是预期，写进文档。<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(0,0,0,.035);border-radius:14px;padding:16px 18px\">\n        <div style=\"font:600 12.5px/1.4 inherit;margin-bottom:4px\">列表页<\u002Fdiv>\n        <div style=\"font:400 10.5px/1.5 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42);margin-bottom:12px\">清理 · 应用 · 优化 · 大文件<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px;font:400 11.5px/1.5 inherit;color:rgba(0,0,0,.68)\">\n          <div style=\"background:rgba(11,143,132,.14);border-radius:6px;padding:5px 8px\">报头<\u002Fdiv>\n          <div style=\"background:rgba(0,0,0,.04);border-radius:6px;padding:4px 8px;font-size:10.5px\">说明行（可选）<\u002Fdiv>\n          <div style=\"background:rgba(31,107,212,.12);border-radius:6px;padding:4px 8px;font-size:10.5px\">页签（可选，28）<\u002Fdiv>\n          <div style=\"background:rgba(255,255,255,.7);border-radius:6px;padding:5px 8px\">筛选行 28<\u002Fdiv>\n          <div style=\"background:rgba(255,255,255,.7);border-radius:6px;padding:7px 8px\">选择条 48<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px\"><div style=\"background:rgba(255,255,255,.7);border-radius:6px;padding:6px 8px\">行 56<\u002Fdiv><div style=\"background:rgba(255,255,255,.7);border-radius:6px;padding:6px 8px\">行 56<\u002Fdiv><div style=\"background:rgba(255,255,255,.7);border-radius:6px;padding:6px 8px\">行 56<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font:400 11px/1.7 inherit;color:rgba(0,0,0,.55);margin:12px 0 0\">清理页的摘要卡是这一模板的「英雄卡」变体：它占据筛选行与选择条的位置，内含唯一的英雄档按钮。<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(0,0,0,.035);border-radius:14px;padding:16px 18px\">\n        <div style=\"font:600 12.5px/1.4 inherit;margin-bottom:4px\">地图页<\u002Fdiv>\n        <div style=\"font:400 10.5px/1.5 ui-monospace,'SF Mono',Menlo,monospace;color:rgba(0,0,0,.42);margin-bottom:12px\">空间 · 地图<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px;font:400 11.5px/1.5 inherit;color:rgba(0,0,0,.68)\">\n          <div style=\"background:rgba(11,143,132,.14);border-radius:6px;padding:5px 8px\">报头<\u002Fdiv>\n          <div style=\"background:rgba(0,0,0,.04);border-radius:6px;padding:4px 8px;font-size:10.5px\">说明行<\u002Fdiv>\n          <div style=\"background:rgba(255,255,255,.7);border-radius:6px;padding:5px 8px\">面包屑栏 40<\u002Fdiv>\n          <div style=\"background:rgba(255,255,255,.7);border-radius:6px;padding:16px 8px;text-align:center\">地图卡 500<\u002Fdiv>\n          <div style=\"display:flex;gap:5px\"><div style=\"flex:1;background:rgba(255,255,255,.7);border-radius:6px;padding:5px 8px;text-align:center\">卡<\u002Fdiv><div style=\"flex:1;background:rgba(255,255,255,.7);border-radius:6px;padding:5px 8px;text-align:center\">卡<\u002Fdiv><div style=\"flex:1;background:rgba(255,255,255,.7);border-radius:6px;padding:5px 8px;text-align:center\">卡<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font:400 11px/1.7 inherit;color:rgba(0,0,0,.55);margin:12px 0 0\">树图瓦片圆角 7 → 8（<code>chip<\u002Fcode>），内缩 2.5 → 2。前 12 卡改标准行卡 56，骨架也 56（现状骨架 76 比真卡 65 高）。<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:24px 26px;margin-bottom:52px\">\n    <div style=\"font:600 16px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:16px\">逐页套用清单<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:0\">\n      <div style=\"display:flex;gap:14px;padding:11px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:600 12px/1.5 inherit\">全部页面<\u002Fdiv><div style=\"flex:1;min-width:220px;font:400 12px/1.7 inherit;color:rgba(0,0,0,.68)\">报头行（28 带 · 基线对齐 · 字标降级）；<code>Page<\u002Fcode> 上边距 12；插槽只放一个默认档控件；说明行恒 16 高<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:11px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:600 12px/1.5 inherit\">侧栏<\u002Fdiv><div style=\"flex:1;min-width:220px;font:400 12px/1.7 inherit;color:rgba(0,0,0,.68)\">图标盒 28（r8）；左边线统一 24；底栏「井」保持 r12 / 内边距 12；可用空间数值改 <code>subheadNumeric<\u002Fcode><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:11px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:600 12px/1.5 inherit\">概览<\u002Fdiv><div style=\"flex:1;min-width:220px;font:400 12px/1.7 inherit;color:rgba(0,0,0,.68)\">两颗按钮同为英雄档 44；「看看有哪些」满足玻璃可辨度（66% 白底 + 16% 描边 + ink 字）；信任句 <code>caption<\u002Fcode>；统计网格最小宽 224；权限卡按钮改强调档 36<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:11px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:600 12px/1.5 inherit\">清理<\u002Fdiv><div style=\"flex:1;min-width:220px;font:400 12px/1.7 inherit;color:rgba(0,0,0,.68)\">摘要卡英雄档保留（可逆，实心 aqua）；「跳过废纸篓」开关开启后主按钮文案改「永久删除」并<strong style=\"font-weight:600;color:#0B1826\">要求二次确认 Sheet<\u002Fstrong>；快选改 Tertiary；类别头 64 + <code>subhead<\u002Fcode>；安全芯片改 <code>Badge<\u002Fcode>；条目行改紧凑表格行 40，「访达」改图标按钮；完成卡两键强调档 36<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:11px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:600 12px/1.5 inherit\">应用 · 已安装<\u002Fdiv><div style=\"flex:1;min-width:220px;font:400 12px/1.7 inherit;color:rgba(0,0,0,.68)\">页签下沉；筛选行 28 / 全 13pt；选择条 48 + 默认档；「卸载所选」改 danger 描边；行 56、数值列 80、动作区 96；「系统自带」改 <code>Badge<\u002Fcode> 中性档；卸载 Sheet 页脚两键默认档，确认键实心 <code>#C0342F<\u002Fcode><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:11px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:600 12px/1.5 inherit\">应用 · 开机启动<\u002Fdiv><div style=\"flex:1;min-width:220px;font:400 12px/1.7 inherit;color:rgba(0,0,0,.68)\">说明行按钮改默认档并移入插槽（页面只剩一个页面级控件）；排序分段 28；行 56；「移除」danger 描边紧凑档；「开机即启动」改 <code>Badge<\u002Fcode> caution<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:11px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:600 12px/1.5 inherit\">空间<\u002Fdiv><div style=\"flex:1;min-width:220px;font:400 12px/1.7 inherit;color:rgba(0,0,0,.68)\">页签下沉；面包屑栏 40；插槽「重新查找」默认档；前 12 卡改标准行卡 56（骨架同高）；大文件行 56 / 72；<strong style=\"font-weight:600;color:#0B1826\">「移到废纸篓」改中性描边、常显<\u002Fstrong>（可逆，不该染红也不该藏在悬停里）<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:11px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:600 12px/1.5 inherit\">优化<\u002Fdiv><div style=\"flex:1;min-width:220px;font:400 12px/1.7 inherit;color:rgba(0,0,0,.68)\">任务卡圆角 22 → 16、高 56（带警告 72）；「执行」紧凑档；「执行选中项」默认档；结果行改 <code>tag<\u002Fcode> 9；选择条 48<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:11px 0;border-bottom:.5px solid rgba(0,0,0,.07);flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:600 12px/1.5 inherit\">监控<\u002Fdiv><div style=\"flex:1;min-width:220px;font:400 12px/1.7 inherit;color:rgba(0,0,0,.68)\">控件行全部 28（搜索、两个分段）；进程行 40；「系统」改 <code>Badge<\u002Fcode> 紧凑；散热徽章改 <code>Badge<\u002Fcode>（现在是另写一份）；「结束进程」图标按钮 danger + Alert；<code>CapacityBar<\u002Fcode> 统一 4<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:11px 0;flex-wrap:wrap\"><div style=\"width:120px;flex:none;font:600 12px/1.5 inherit\">设置 / 菜单栏 / Sheet<\u002Fdiv><div style=\"flex:1;min-width:220px;font:400 12px/1.7 inherit;color:rgba(0,0,0,.68)\">不再另起炉灶：设置窗口用 <code>SectionLabel<\u002Fcode> + 28 系统控件 + <code>body<\u002Fcode> 13 标签，按钮强调档；菜单栏品牌图标盒 24 + <code>subhead<\u002Fcode>，数值 <code>subheadNumeric<\u002Fcode>，「去清理」强调档 wide；Sheet 头部图标盒 44、标题 <code>cardTitle<\u002Fcode>、列表用紧凑表格行 40、页脚两键默认档<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.12em;color:rgba(0,0,0,.42);text-transform:uppercase;margin:0 0 8px\">第八部分<\u002Fdiv>\n  <h2 style=\"font:600 24px/1.3 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;margin:0 0 8px\">落地 · 可直接抄的代码<\u002Fh2>\n  <p style=\"font:400 13.5px/1.7 inherit;color:rgba(0,0,0,.55);margin:0 0 20px;max-width:68ch\">先改 <code>Design/<\u002Fcode>，组件到位后一页一页换。核心思路：<strong style=\"font-weight:600;color:#0B1826\">把违规变成写不出来<\u002Fstrong>，而不是靠文档提醒。<\u002Fp>\n\n  <div style=\"background:rgba(11,24,38,.94);border-radius:18px;padding:20px 22px;margin-bottom:14px;overflow-x:auto\">\n    <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.1em;color:rgba(255,255,255,.45);text-transform:uppercase;margin-bottom:12px\">Design/Theme.swift · 新增令牌<\u002Fdiv>\n<pre style=\"margin:0;font:400 11.5px/1.75 ui-monospace,'SF Mono',Menlo,monospace;color:#D8E6F2;white-space:pre\">/// 可点对象的高度。只有这四个值。\npublic enum Control {\n    public static let compact: CGFloat  = 24  // 行内、图标按钮\n    public static let standard: CGFloat = 28  // 默认档 —— 90% 的控件\n    public static let emphasis: CGFloat = 36  // 卡内主动作\n    public static let hero: CGFloat     = 44  // 每页最多一组\n\n    /// 系统控件对齐：SwiftUI 的 controlSize 映射到本档位。\n    public static func controlSize(for height: CGFloat) -&gt; ControlSize {\n        height &gt;= emphasis ? .extraLarge : (height &gt;= standard ? .large : .small)\n    }\n}\n\n/// SF Symbol 的点尺寸。不再借用 Typo.Step。\npublic enum Glyph {\n    public static let badge: CGFloat   = 9   // 徽章内、排序箭头\n    public static let caption: CGFloat = 11  // 说明行、图标按钮\n    public static let control: CGFloat = 13  // 默认档按钮内\n    public static let row: CGFloat     = 15  // 行主图标、英雄档按钮内\n    public static let card: CGFloat    = 17  // 扫描卡、战绩条\n    public static let title: CGFloat   = 20  // 权限卡、Sheet 头\n    public static let feature: CGFloat = 30  // 空态\n}\n\n/// 有底色的方形图标容器。尺寸与圆角成对，不可拆开。\npublic enum IconBox {\n    case small      // 24 / r6  菜单栏品牌\n    case masthead   // 28 / r8  报头品牌（= 报头带高）\n    case medium     // 32 / r8  类别、横幅、行内应用图标\n    case large      // 44 / r12 Sheet 头部\n\n    public var side: CGFloat { switch self {\n        case .small: 24; case .masthead: 28; case .medium: 32; case .large: 44 } }\n    public var radius: CGFloat { switch self {\n        case .small: 6; case .masthead, .medium: 8; case .large: 12 } }\n}\n\n/// 动效五档 + 入场。取代现有 13 种时长。\npublic enum Motion {\n    public static let press  = Animation.snappy(duration: 0.16)\n    public static let hover  = Animation.smooth(duration: 0.20)\n    public static let state  = Animation.smooth(duration: 0.25)\n    public static let reveal = Animation.smooth(duration: 0.30)\n    public static let settle = Animation.smooth(duration: 0.50)\n    public static let enter  = Animation.smooth(duration: 0.55)\n    public static let enterStagger: Double = 0.06\n}\n\nextension Radius {\n    /// 小方块：复选框、图例、树图瓦片。\n    public static let control: CGFloat = 4\n}<\u002Fpre>\n  <\u002Fdiv>\n\n  <div style=\"background:rgba(11,24,38,.94);border-radius:18px;padding:20px 22px;margin-bottom:14px;overflow-x:auto\">\n    <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.1em;color:rgba(255,255,255,.45);text-transform:uppercase;margin-bottom:6px\">Design/Actions.swift · 把破坏性语法编进类型<\u002Fdiv>\n    <p style=\"font:400 11.5px/1.7 -apple-system,'PingFang SC',system-ui,sans-serif;color:rgba(216,230,242,.6);margin:0 0 14px;max-width:76ch\">这是与 v1.0 最大的实现差异。v1.0 给 <code style=\"background:rgba(255,255,255,.1);color:#9FD8CF\">PrimaryButtonStyle<\u002Fcode> 加一个 <code style=\"background:rgba(255,255,255,.1);color:#9FD8CF\">size:<\u002Fcode> 参数，<code style=\"background:rgba(255,255,255,.1);color:#9FD8CF\">tint:<\u002Fcode> 仍然自由——于是「实心 danger」照样写得出来。这里让调用方声明<strong style=\"font-weight:600;color:#E8F2F8\">意图<\u002Fstrong>，形态由意图推导，实心 danger 只有在确认界面里才成立。<\u002Fp>\n<pre style=\"margin:0;font:400 11.5px/1.75 ui-monospace,'SF Mono',Menlo,monospace;color:#D8E6F2;white-space:pre\">/// 这个动作对用户意味着什么。形态与颜色由它推导，调用方不选颜色。\npublic enum ActionIntent {\n    case neutral        // 中性：打开、刷新、取消\n    case go             // 让用户变好，且可撤回 —— 唯一可实心的意图\n    case reversible     // 可逆的删除：移到废纸篓\n    case destructive    // 不可逆的提议：卸载、永久删除、结束进程\n    case confirm        // 不可逆的确认 —— 仅确认界面\n}\n\npublic struct ActionButtonStyle: ButtonStyle {\n    var intent: ActionIntent = .neutral\n    var height: CGFloat = Control.standard\n    var wide: Bool = false\n\n    /// 由 ConfirmationSurface 注入。confirm 只在它为 true 时才画实心。\n    @Environment(\\.isConfirmationSurface) private var inConfirmation\n\n    public func makeBody(configuration: Configuration) -&gt; some View {\n        // 形态：填充 / 描边 / 纯文字，由 intent 决定，调用方无法覆盖。\n        //   .go      → aquaSweep 实心，白字\n        //   .confirm → danger 深值实心，白字（仅 inConfirmation）\n        //   其余     → 玻璃胶囊 + 描边，字色 = intent 的语义色\n        // 尺寸：字号与内边距由 height 查表，不接受单独传参。\n        // 断言：intent == .confirm &amp;&amp; !inConfirmation → assertionFailure\n        // 断言：intent == .destructive &amp;&amp; height == Control.hero → assertionFailure\n        …\n    }\n}\n\nextension View {\n    /// 确认界面（Sheet / Alert）用它包住内容，才解锁 .confirm 的实心形态。\n    public func confirmationSurface() -&gt; some View {\n        environment(\\.isConfirmationSurface, true)\n    }\n}<\u002Fpre>\n  <\u002Fdiv>\n\n  <div style=\"background:rgba(11,24,38,.94);border-radius:18px;padding:20px 22px;margin-bottom:14px;overflow-x:auto\">\n    <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.1em;color:rgba(255,255,255,.45);text-transform:uppercase;margin-bottom:6px\">Design/Containers.swift · 容器施加尺寸<\u002Fdiv>\n    <p style=\"font:400 11.5px/1.7 -apple-system,'PingFang SC',system-ui,sans-serif;color:rgba(216,230,242,.6);margin:0 0 14px;max-width:76ch\">原则一的实现：子项从环境读高度，不从调用点读。页面写不出「三个不同高度并排」。<\u002Fp>\n<pre style=\"margin:0;font:400 11.5px/1.75 ui-monospace,'SF Mono',Menlo,monospace;color:#D8E6F2;white-space:pre\">/// 一行筛选控件。高度与字号由行施加给所有子项。\npublic struct FilterRow&lt;Content: View&gt;: View {\n    @ViewBuilder var content: Content\n    public var body: some View {\n        HStack(spacing: Space.md) { content }\n            .frame(height: Control.standard)\n            .font(Typo.body)                       // 全行一个字号\n            .controlSize(.large)                   // 系统控件对上 28\n            .environment(\\.rowControlHeight, Control.standard)\n    }\n}\n\n/// 报头行。侧栏与内容列各调一次，共享同一条基线。\npublic struct Masthead&lt;Trailing: View&gt;: View {\n    let title: String\n    let subtitle: String?\n    @ViewBuilder var trailing: Trailing            // 恰好一个默认档控件\n\n    public var body: some View {\n        HStack(alignment: .firstTextBaseline, spacing: Space.lg) {\n            Text(title).font(Typo.pageTitle).foregroundStyle(Palette.ink)\n            Spacer(minLength: Space.md)\n            trailing\n                .frame(height: Control.standard)\n                .alignmentGuide(.firstTextBaseline) { $0[.bottom] - 7 }\n        }\n        .frame(height: Control.standard, alignment: .bottom)\n        .padding(.top, Space.md)                   // 标题栏下缘 +12\n    }\n}\n\n/// 页签。不再进报头插槽 —— 它切换的是下面的列表。\npublic struct PageTabs&lt;S: Hashable&gt;: View { … }    // 28 高，内容列左边线<\u002Fpre>\n  <\u002Fdiv>\n\n  <div style=\"background:rgba(11,24,38,.94);border-radius:18px;padding:20px 22px;margin-bottom:52px;overflow-x:auto\">\n    <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.1em;color:rgba(255,255,255,.45);text-transform:uppercase;margin-bottom:12px\">CI 拦截 · 五条（v1.0 三条 + 两条新增）<\u002Fdiv>\n<pre style=\"margin:0;font:400 11.5px/1.75 ui-monospace,'SF Mono',Menlo,monospace;color:#D8E6F2;white-space:pre\">P=Sources/MacPlecoKit\nF=\"$P/Features $P/App\"\n\n# 1 页面里不得拼字号\ngrep -rn '\\.font(\\.system(size:' $F &amp;&amp; exit 1\n# 2 不得有圆角字面量\ngrep -rnE 'cornerRadius: [0-9]' $P --include='*.swift' | grep -v Design/ &amp;&amp; exit 1\n# 3 不得对间距做算术\ngrep -rnE 'Space\\.[a-z]+ [+-] ' $P &amp;&amp; exit 1\n# 4 ✚ 页面不得自己写高度（高度只能来自 Control）\ngrep -rnE '\\.frame\\((height|minHeight): [0-9]' $F &amp;&amp; exit 1\n# 5 ✚ 破坏性动作不得实心（intent 之外不许传 tint）\ngrep -rn 'ActionButtonStyle(.*tint:' $P &amp;&amp; exit 1\ngrep -rn 'PrimaryButtonStyle(tint: .danger' $P &amp;&amp; exit 1<\u002Fpre>\n  <\u002Fdiv>\n\n  <div style=\"font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.12em;color:rgba(0,0,0,.42);text-transform:uppercase;margin:0 0 8px\">第九部分<\u002Fdiv>\n  <h2 style=\"font:600 24px/1.3 ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',system-ui,sans-serif;margin:0 0 8px\">与 v1.0 的差异 · 验收数字<\u002Fh2>\n\n  <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:24px 26px;margin-bottom:14px;overflow-x:auto\">\n    <div style=\"min-width:600px\">\n      <div style=\"display:flex;gap:14px;padding-bottom:9px;border-bottom:.5px solid rgba(0,0,0,.12)\">\n        <div style=\"width:132px;flex:none;font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;color:rgba(0,0,0,.42);text-transform:uppercase\">议题<\u002Fdiv>\n        <div style=\"flex:1;font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;color:rgba(0,0,0,.42);text-transform:uppercase\">v1.0<\u002Fdiv>\n        <div style=\"flex:1;font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;color:#0B8F84;text-transform:uppercase\">本标准<\u002Fdiv>\n        <div style=\"flex:1.15;font:600 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;color:rgba(0,0,0,.42);text-transform:uppercase\">为什么<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.06);font:400 11.5px/1.65 inherit\"><div style=\"width:132px;flex:none;font-weight:600\">对齐基准<\u002Fdiv><div style=\"flex:1;color:rgba(0,0,0,.55)\">文字框中心 y 相等<\u002Fdiv><div style=\"flex:1;color:#0B1826\">共享基线 + 字标降级<\u002Fdiv><div style=\"flex:1.15;color:rgba(0,0,0,.62)\">中英混排下框居中不等于视觉对齐；层级分开后不再互比<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.06);font:400 11.5px/1.65 inherit\"><div style=\"width:132px;flex:none;font-weight:600\">控件档位<\u002Fdiv><div style=\"flex:1;color:rgba(0,0,0,.55)\">24 / 32 / 44（无默认档）<\u002Fdiv><div style=\"flex:1;color:#0B1826\">24 / <strong style=\"font-weight:600\">28<\u002Fstrong> / 36 / 44<\u002Fdiv><div style=\"flex:1.15;color:rgba(0,0,0,.62)\">13pt 中文需 7pt 余量；28 = macOS <code>.large<\u002Fcode>；44 是 iOS 触控尺寸不是控件档<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.06);font:400 11.5px/1.65 inherit\"><div style=\"width:132px;flex:none;font-weight:600\">破坏性动作<\u002Fdiv><div style=\"flex:1;color:rgba(0,0,0,.55)\">降到 32，允许实心 danger<\u002Fdiv><div style=\"flex:1;color:#0B1826\">默认档 28，<strong style=\"font-weight:600\">禁止实心<\u002Fstrong>；实心只在确认界面<\u002Fdiv><div style=\"flex:1.15;color:rgba(0,0,0,.62)\">兑现 README 第一原则；白字压 danger 玻璃只有 2.6:1<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.06);font:400 11.5px/1.65 inherit\"><div style=\"width:132px;flex:none;font-weight:600\">可逆的删除<\u002Fdiv><div style=\"flex:1;color:rgba(0,0,0,.55)\">未区分，一律 danger<\u002Fdiv><div style=\"flex:1;color:#0B1826\">「移到废纸篓」中性描边<\u002Fdiv><div style=\"flex:1.15;color:rgba(0,0,0,.62)\">把可还原的动作染红，等于教用户忽略红色<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.06);font:400 11.5px/1.65 inherit\"><div style=\"width:132px;flex:none;font-weight:600\">页签归属<\u002Fdiv><div style=\"flex:1;color:rgba(0,0,0,.55)\">留在报头插槽（插槽高度随内容变，其 P10）<\u002Fdiv><div style=\"flex:1;color:#0B1826\">下沉到内容左边线；插槽恒 28、永不放导航<\u002Fdiv><div style=\"flex:1.15;color:rgba(0,0,0,.62)\">导航属于它切换的内容，不属于页面标题行<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.06);font:400 11.5px/1.65 inherit\"><div style=\"width:132px;flex:none;font-weight:600\">落地机制<\u002Fdiv><div style=\"flex:1;color:rgba(0,0,0,.55)\">令牌 + 组件加 <code>size:<\u002Fcode> 参数 + grep<\u002Fdiv><div style=\"flex:1;color:#0B1826\">容器施加尺寸 + <code>ActionIntent<\u002Fcode> 推导形态 + 5 条 grep<\u002Fdiv><div style=\"flex:1.15;color:rgba(0,0,0,.62)\">令牌管不住一致性——<code>SearchField<\u002Fcode> 是唯一实现，仍然高 31<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.06);font:400 11.5px/1.65 inherit\"><div style=\"width:132px;flex:none;font-weight:600\">数字排版<\u002Fdiv><div style=\"flex:1;color:rgba(0,0,0,.55)\">补了 4 个 <code>*Numeric<\u002Fcode> 角色<\u002Fdiv><div style=\"flex:1;color:#0B1826\">＋ 单位分离 / 精度分档 / 列宽 80 / 基线对齐<\u002Fdiv><div style=\"flex:1.15;color:rgba(0,0,0,.62)\">这是一个量东西的 App，数字排版是正文排版<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.06);font:400 11.5px/1.65 inherit\"><div style=\"width:132px;flex:none;font-weight:600\">玻璃可辨度<\u002Fdiv><div style=\"flex:1;color:rgba(0,0,0,.55)\">未涉及<\u002Fdiv><div style=\"flex:1;color:#0B1826\">可点玻璃 ≥ 66% 白底 + ≥ 16% 描边 + ink 字<\u002Fdiv><div style=\"flex:1.15;color:rgba(0,0,0,.62)\">浅色「深水」地上，纯玻璃控件没有边界<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:12px 0;font:400 11.5px/1.65 inherit\"><div style=\"width:132px;flex:none;font-weight:600\">中英混排<\u002Fdiv><div style=\"flex:1;color:rgba(0,0,0,.55)\">只提「按中文量固定宽」<\u002Fdiv><div style=\"flex:1;color:#0B1826\">行高 / 字重上限 / 内边距下限 / tracking 全套规则<\u002Fdiv><div style=\"flex:1.15;color:rgba(0,0,0,.62)\">中文字身满格，留白与字重不能照抄拉丁<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:30px\">\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:22px 24px\">\n      <div style=\"font:600 15px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:14px\">验收数字 <span style=\"font:400 11px/1 inherit;color:rgba(0,0,0,.42)\">1200×800 · 中文<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:0;font:400 11.5px/1.6 inherit\">\n        <div style=\"display:flex;gap:10px;padding:8px 0;border-bottom:.5px solid rgba(0,0,0,.06)\"><div style=\"flex:1;color:rgba(0,0,0,.68)\">品牌字标基线 / 页面标题基线<\u002Fdiv><div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#0B1826;flex:none\">相等 · +33<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;padding:8px 0;border-bottom:.5px solid rgba(0,0,0,.06)\"><div style=\"flex:1;color:rgba(0,0,0,.68)\">侧栏品牌 x / 导航项 x<\u002Fdiv><div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#0B1826;flex:none\">24 / 24<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;padding:8px 0;border-bottom:.5px solid rgba(0,0,0,.06)\"><div style=\"flex:1;color:rgba(0,0,0,.68)\">报头插槽高（每一页）<\u002Fdiv><div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#0B1826;flex:none\">28<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;padding:8px 0;border-bottom:.5px solid rgba(0,0,0,.06)\"><div style=\"flex:1;color:rgba(0,0,0,.68)\">说明行高 / 带按钮时<\u002Fdiv><div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#0B1826;flex:none\">16 / 16<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;padding:8px 0;border-bottom:.5px solid rgba(0,0,0,.06)\"><div style=\"flex:1;color:rgba(0,0,0,.68)\">筛选行高 / 其中每个控件<\u002Fdiv><div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#0B1826;flex:none\">28 / 28<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;padding:8px 0;border-bottom:.5px solid rgba(0,0,0,.06)\"><div style=\"flex:1;color:rgba(0,0,0,.68)\">筛选行内每个标签字号<\u002Fdiv><div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#0B1826;flex:none\">13 · 全部<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;padding:8px 0;border-bottom:.5px solid rgba(0,0,0,.06)\"><div style=\"flex:1;color:rgba(0,0,0,.68)\">选择条高 / 其中按钮<\u002Fdiv><div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#0B1826;flex:none\">48 / 28<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;padding:8px 0;border-bottom:.5px solid rgba(0,0,0,.06)\"><div style=\"flex:1;color:rgba(0,0,0,.68)\">标准行卡 / 紧凑表格行<\u002Fdiv><div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#0B1826;flex:none\">56 / 40<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;padding:8px 0;border-bottom:.5px solid rgba(0,0,0,.06)\"><div style=\"flex:1;color:rgba(0,0,0,.68)\">行标题左边线（距行内边缘）<\u002Fdiv><div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#0B1826;flex:none\">72 · 全站<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;padding:8px 0;border-bottom:.5px solid rgba(0,0,0,.06)\"><div style=\"flex:1;color:rgba(0,0,0,.68)\">数值列 / 动作区宽<\u002Fdiv><div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#0B1826;flex:none\">80 / 96<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;padding:8px 0;border-bottom:.5px solid rgba(0,0,0,.06)\"><div style=\"flex:1;color:rgba(0,0,0,.68)\">徽章高（标准 / 紧凑）· 复选框<\u002Fdiv><div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#0B1826;flex:none\">18 / 16 · 16<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;padding:8px 0;border-bottom:.5px solid rgba(0,0,0,.06)\"><div style=\"flex:1;color:rgba(0,0,0,.68)\">页内英雄档按钮组 / 实心色块<\u002Fdiv><div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#0B1826;flex:none\">≤ 1 / ≤ 1<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;padding:8px 0;border-bottom:.5px solid rgba(0,0,0,.06)\"><div style=\"flex:1;color:rgba(0,0,0,.68)\">实心 danger 出现次数（主窗口）<\u002Fdiv><div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#B8302B;flex:none\">0<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;padding:8px 0\"><div style=\"flex:1;color:rgba(0,0,0,.68)\">CI 五条 grep<\u002Fdiv><div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#0B1826;flex:none\">全部 0 命中<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:22px 24px\">\n      <div style=\"font:600 15px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:14px\">落地顺序<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;gap:11px\"><div style=\"width:20px;height:20px;border-radius:999px;background:rgba(11,143,132,.14);display:flex;align-items:center;justify-content:center;flex:none;font:700 11px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;color:#066A62\">1<\u002Fdiv><div style=\"font:400 12px/1.65 inherit;color:rgba(0,0,0,.68)\"><strong style=\"font-weight:600;color:#0B1826\">令牌<\u002Fstrong>：<code>Control<\u002Fcode>、<code>Glyph<\u002Fcode>、<code>IconBox<\u002Fcode>、<code>Motion<\u002Fcode>、<code>Radius.control<\u002Fcode>；<code>Typo<\u002Fcode> 补 4 个 <code>*Numeric<\u002Fcode>，<code>Typo.Step<\u002Fcode> 收回 <code>Design/<\u002Fcode> 内部<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:11px\"><div style=\"width:20px;height:20px;border-radius:999px;background:rgba(11,143,132,.14);display:flex;align-items:center;justify-content:center;flex:none;font:700 11px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;color:#066A62\">2<\u002Fdiv><div style=\"font:400 12px/1.65 inherit;color:rgba(0,0,0,.68)\"><strong style=\"font-weight:600;color:#0B1826\">语义层<\u002Fstrong>：<code>ActionIntent<\u002Fcode> + <code>ActionButtonStyle<\u002Fcode> + <code>confirmationSurface()<\u002Fcode>。这一步单独做，因为它改变的是含义不是尺寸<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:11px\"><div style=\"width:20px;height:20px;border-radius:999px;background:rgba(11,143,132,.14);display:flex;align-items:center;justify-content:center;flex:none;font:700 11px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;color:#066A62\">3<\u002Fdiv><div style=\"font:400 12px/1.65 inherit;color:rgba(0,0,0,.68)\"><strong style=\"font-weight:600;color:#0B1826\">容器<\u002Fstrong>：<code>Masthead<\u002Fcode>、<code>FilterRow<\u002Fcode>、<code>PageTabs<\u002Fcode>、<code>Badge<\u002Fcode>、<code>IconButton<\u002Fcode>；<code>SelectionBar<\u002Fcode> 改 48、<code>SearchField<\u002Fcode> 改 28、<code>TriStateBox<\u002Fcode> 改 16、<code>CapacityBar<\u002Fcode> 只留 4 / 6<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:11px\"><div style=\"width:20px;height:20px;border-radius:999px;background:rgba(11,143,132,.14);display:flex;align-items:center;justify-content:center;flex:none;font:700 11px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;color:#066A62\">4<\u002Fdiv><div style=\"font:400 12px/1.65 inherit;color:rgba(0,0,0,.68)\"><strong style=\"font-weight:600;color:#0B1826\">页面<\u002Fstrong>：报头（全部，一次改完最见效）→ 应用 → 清理 → 空间 → 优化 → 监控 → 设置 / 菜单栏 / Sheet<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:11px\"><div style=\"width:20px;height:20px;border-radius:999px;background:rgba(11,143,132,.14);display:flex;align-items:center;justify-content:center;flex:none;font:700 11px/1 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;color:#066A62\">5<\u002Fdiv><div style=\"font:400 12px/1.65 inherit;color:rgba(0,0,0,.68)\"><strong style=\"font-weight:600;color:#0B1826\">拦截与验收<\u002Fstrong>：5 条 grep 进 CI；探针量到左表全部数字<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(11,143,132,.09);border-radius:12px;padding:14px 16px;margin-top:16px\">\n        <p style=\"font:400 11.5px/1.75 inherit;color:rgba(0,0,0,.68);margin:0\">第 1、3 步是纯机械改动，可以一次提交；<strong style=\"font-weight:600;color:#0B1826\">第 2 步会改变界面的语气<\u002Fstrong>，建议单独一个 PR，配一版截图对比——它把「拿走东西的按钮」从最响改成最安静，这是产品决定，不是样式决定。<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:.5px solid rgba(0,0,0,.12);border-radius:22px;padding:22px 24px\">\n    <div style=\"font:600 15px/1.3 ui-rounded,'SF Pro Rounded',system-ui,sans-serif;margin-bottom:10px\">还没定的三件事<\u002Fdiv>\n    <ul style=\"margin:0;padding-left:16px;font:400 12.5px/1.85 inherit;color:rgba(0,0,0,.68)\">\n      <li><strong style=\"font-weight:600\">深色模式的实心 danger 底色<\u002Fstrong>：浅色用 <code>#C0342F<\u002Fcode>（白字 4.6:1）；深色下 <code>danger<\u002Fcode> 是 <code>#FF7A72<\u002Fcode>，实心配白字只有 2.1:1，需要改成深底 + <code>#FF9E98<\u002Fcode> 文字，或者深色下确认键也走描边。倾向后者——更一致。<\u002Fli>\n      <li><strong style=\"font-weight:600\">监控页四张仪表卡的最小宽<\u002Fstrong>：统一到 224 后，中文图例在 1200 窗口下会更早换到两行形态。要么接受两行，要么给仪表卡单独一个 236 的例外。倾向接受两行。<\u002Fli>\n      <li><strong style=\"font-weight:600\">「跳过废纸篓」的开关位置<\u002Fstrong>：它现在藏在摘要卡里，开启后主按钮就变成不可逆操作。按本标准，那颗按钮应该同时改文案、改形态、并要求二次确认——也可以更激进：把这个开关移到设置窗口，让主界面永远只有可逆动作。想听你的意见。<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;compareV1&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;文档呈现&quot;},&quot;showEvidence&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;文档呈现&quot;},&quot;showBefore&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;文档呈现&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const p = this.props || {};\n    return {\n      compareV1: p.compareV1 ?? true,\n      showEvidence: p.showEvidence ?? true,\n      showBefore: p.showBefore ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
