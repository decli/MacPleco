name: Release

# Cutting a release means either bumping VERSION or putting [release] in the
# commit message. The tag is created by the workflow rather than pushed by
# hand, which keeps the published artifacts and the tag guaranteed to come from
# the same commit.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.1.0)"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[release]') ||
      contains(github.event.head_commit.modified, 'VERSION')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Resolve version
        id: version
        run: |
          RAW="${{ github.event.inputs.version }}"
          if [ -z "$RAW" ]; then
            RAW="$(tr -d '[:space:]' < VERSION)"
          fi
          if [ -z "$RAW" ]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          echo "number=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=v$RAW" >> "$GITHUB_OUTPUT"
          echo "Publishing v$RAW"

      - name: Test
        run: swift test

      - name: Build app bundle
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-app.sh "${{ steps.version.outputs.number }}"

      - name: Package disk image
        run: ./scripts/make-dmg.sh "${{ steps.version.outputs.number }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacPleco-${{ steps.version.outputs.tag }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing its assets."
          else
            # Creates the tag at this commit as a side effect.
            gh release create "$TAG" \
              --title "MacPleco $TAG" \
              --notes-file .github/RELEASE_NOTES.md \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" dist/*.dmg dist/*.zip --clobber
          gh release view "$TAG" --json url,assets \
            --jq '.url, (.assets[] | "  \(.name)  \(.size) bytes")'
