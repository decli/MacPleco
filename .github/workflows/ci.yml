name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
          xcodebuild -version
          echo "SDKs:"; xcodebuild -showsdks | grep -i macos || true

      - name: Build (debug)
        run: swift build -c debug 2>&1 | tee build.log

      - name: Test
        run: swift test 2>&1 | tee test.log

  package:
    name: Package .app
    runs-on: macos-26
    needs: build
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build app bundle
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-app.sh "0.0.0-ci"

      - name: Package disk image
        run: ./scripts/make-dmg.sh "0.0.0-ci"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacPleco-ci
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
