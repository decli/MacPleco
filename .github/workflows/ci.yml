name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & package
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
          xcodebuild -version

      # Cheapest gate first: the interface rules are grep-enforceable, and a
      # violation here means the design system was bypassed rather than
      # extended. See docs/ui-standard.md.
      - name: Check UI standard
        run: |
          chmod +x scripts/*.sh
          ./scripts/check-ui-standard.sh

      # The release/universal build is the gate, not a debug build. They do not
      # agree: a debug build passed while this one caught two actor-isolation
      # errors, because multi-arch routes through a different build system.
      - name: Build app bundle
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-app.sh "0.0.0-ci"

      - name: Test
        run: swift test

      - name: Package disk image
        run: ./scripts/make-dmg.sh "0.0.0-ci"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacPleco-ci
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
